[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-boq-engine"
version = "0.1.0"
description = "IFC -> Bill of Quantities engine: parse, dictionaries, measure, rules, classification, Excel export."
requires-python = ">=3.10,<3.14"
dependencies = [
  "ifcopenshell>=0.8.0,<0.9.99",
  "numpy>=1.26",
  "trimesh>=4.4",
  "networkx>=3.0",
  "manifold3d>=2.5",
  "openpyxl>=3.1",
  "jsonschema>=4.21",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "boto3>=1.35,<2",
  "psycopg[binary]>=3.2,<4",
  "google-re2>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "hypothesis>=6.100,<7", "ruff==0.17.6", "mypy==2.4.1"]

[project.scripts]
ifc-boq = "ifc_boq.cli:main"
boqlet-worker = "ifc_boq.worker_queue:main"

[tool.setuptools.packages.find]
include = ["ifc_boq*"]

[tool.setuptools.package-data]
ifc_boq = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: re-runs a review sample (docs/review/_samples); skipped when the samples are not fetched",
  "libreoffice: opens exported workbooks in LibreOffice (review B-11); skipped without soffice unless BOQLET_REQUIRE_LIBREOFFICE=1",
]

[tool.ruff]
# Review B-10: `npm run test:engine` runs `ruff check` before pytest (scripts/run-engine.mjs).
target-version = "py310"
line-length = 120
extend-exclude = [".venv", ".cache"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade. Left out: E501 (no formatter runs; tables and messages
# are long lines on purpose), E741 and E731 (`l` for a line and named lambdas are the house style), B905
# (`zip(strict=True)` would raise where the engine relies on the shorter side today; a behaviour change, not lint).
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "E731", "B905"]

[tool.ruff.lint.per-file-ignores]
# A fixture imported from another test module is "redefined" by every test that takes it as a parameter.
"tests/*" = ["F811"]

[tool.mypy]
# Review B-10: strict on the engine package, run by `npm run test:engine` (scripts/run-engine.mjs) before pytest.
python_version = "3.10"
files = ["ifc_boq"]
strict = true
warn_unreachable = false

[[tool.mypy.overrides]]
# Libraries without type hints.
module = ["ifcopenshell", "ifcopenshell.*", "trimesh", "trimesh.*", "manifold3d", "re2", "networkx", "networkx.*",
          "boto3", "boto3.*", "botocore", "botocore.*", "jsonschema", "jsonschema.*", "openpyxl", "openpyxl.*",
          "uvicorn", "psycopg", "psycopg.*"]
ignore_missing_imports = true

# Baseline (review B-10): the error codes each module still has under strict, with today's counts, to burn
# down. Fix a module's errors and remove its codes (or its block); a module not listed here is fully strict.
# 1244 errors in 35 modules on 2026-11-25.

[[tool.mypy.overrides]]
module = "ifc_boq.catalogue"
disable_error_code = ["no-untyped-def", "type-arg", "var-annotated"]  # var-annotated 3, no-untyped-def 2, type-arg 1

[[tool.mypy.overrides]]
module = "ifc_boq.classify"
disable_error_code = ["no-untyped-call", "no-untyped-def", "type-arg", "var-annotated"]  # type-arg 6, no-untyped-call 4, var-annotated 3, no-untyped-def 2

