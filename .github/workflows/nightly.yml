# Nightly checks that are not deploy gates (docs/testing/README.md "CI").
# The API performance budgets (TS-002, review B-09, docs/architecture/nfr.md "API and UI"): tests/perf/api.test.ts
# against Java (CRUD p95 <= 300 ms, a 500-line page p95 <= 500 ms) and 50,000-line run ingestion <= 10 s.
# The UI performance budgets (review B-07, apps/app/e2e-java/perf.spec.ts, docs/architecture/nfr.md "API and UI"):
# the browser suite's `@perf` tests against Java, on a production build of the app. A median over its budget
# fails the job; nothing is deployed from here.
name: nightly

permissions:
  contents: read

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  ui-performance:
    name: UI performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          IFC_BOQ_SKIP_ENGINE_SETUP: "1"
      - run: python -m pip install -e ./engine
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - name: The @perf browser tests against Java
        run: |
          export BOQLET_NATIVE_WORKER_PYTHON="$(command -v python)"
          export BOQLET_NATIVE_NODE="$(command -v node)"
          mvn -B -ntp -f services/api/pom.xml verify -Dtest='NativeWorkerTest#browserSmokeAgainstJava' -Dsurefire.failIfNoSpecifiedTests=false
        env:
          BOQLET_BROWSER_SMOKE: "1"
          BOQLET_BROWSER_PERF: "1"
          BOQLET_BROWSER_SMOKE_FILTER: "@perf"
          IFC_BOQ_PYTHON: python
          AWS_ACCESS_KEY_ID: boqlet-test
          AWS_SECRET_ACCESS_KEY: boqlet-local-test-only
      - name: The measured numbers
        if: always()
        run: grep -h '\[perf\]' services/api/target/browser-smoke.log | tee -a "$GITHUB_STEP_SUMMARY" || true

  api-performance:
    name: API performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          IFC_BOQ_SKIP_ENGINE_SETUP: "1"
      - run: python -m pip install -e ./engine
      - name: The API perf suite and run ingestion against Java
        run: |
          export BOQLET_NATIVE_WORKER_PYTHON="$(command -v python)"
          export BOQLET_NATIVE_NODE="$(command -v node)"
          export PERF_OUT="$RUNNER_TEMP/api-perf.jsonl"
          mvn -B -ntp -f services/api/pom.xml verify -Dtest='NativeWorkerTest#apiPerformanceAgainstJava' -Dsurefire.failIfNoSpecifiedTests=false
        env:
          BOQLET_API_PERF: "1"
          IFC_BOQ_PYTHON: python
          AWS_ACCESS_KEY_ID: boqlet-test
          AWS_SECRET_ACCESS_KEY: boqlet-local-test-only
      - name: The measured numbers
        if: always()
        run: cat "$RUNNER_TEMP/api-perf.jsonl" | tee -a "$GITHUB_STEP_SUMMARY" || true
