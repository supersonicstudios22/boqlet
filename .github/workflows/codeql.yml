# CodeQL code scanning (review B-09, docs/testing/README.md "CI"): the app and test TypeScript, the Java API,
# the Python engine and the workflows themselves. Findings appear under the repository's Security tab and on
# pull requests; this workflow is not a deploy gate.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Java without a build (build-mode none): the Maven build needs the generated API sources and minutes.
        language: [javascript-typescript, java-kotlin, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3.39.5
        with:
          category: /language:${{ matrix.language }}
