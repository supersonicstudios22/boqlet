# CI for boqlet (docs/testing/README.md "CI").
name: ci

permissions:
  contents: read

on:
  push:
    branches: [v_1, main]
  pull_request:
    branches: [v_1, main]

jobs:
  api:
    name: Core API, PostgreSQL workers and HTTP contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          IFC_BOQ_SKIP_ENGINE_SETUP: "1"
      - run: python -m pip install -e ./engine
      # The browser smoke suite against Java (apps/app/e2e-java, NativeWorkerTest#browserSmokeAgainstJava).
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - name: Verify the core and the native workflow
        run: |
          export BOQLET_NATIVE_WORKER_PYTHON="$(command -v python)"
          export BOQLET_NATIVE_NODE="$(command -v node)"
          mvn -B -ntp -f services/api/pom.xml verify
        env:
          BOQLET_NATIVE_QUEUE_TEST: "1"
          # The worker killed for 25 s and the database restarted mid-job (NativeWorkerTest, TF-186, TF-192).
          BOQLET_NATIVE_RESILIENCE: "1"
          # The shared scenario suite against Java (FE-041); its workbook scenarios run this Python.
          BOQLET_NATIVE_SCENARIOS: "1"
          # The app with native sign-in in a browser against Java (FE-041/FE-043).
          BOQLET_BROWSER_SMOKE: "1"
          # Two CPUs run Java, the engine, Node and a browser at once: every suite timeout doubles, and a
          # test that failed only by its timeout gets one retry, listed as flaky in the job summary (review B-08).
          BOQLET_TEST_TIME_FACTOR: "2"
          IFC_BOQ_PYTHON: python
          AWS_ACCESS_KEY_ID: boqlet-test
          AWS_SECRET_ACCESS_KEY: boqlet-local-test-only

  contract:
    name: Contract (lint, codegen drift)
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run api:lint
      - name: Generated API clients match the OpenAPI files
        run: npm run api:check
      - name: Engine JSON Schemas match the TypeScript types
        run: npm run codegen && git diff --exit-code -- packages/types/schema

  typecheck:
    name: Typecheck and build
    runs-on: ubuntu-latest
    env:
      IFC_BOQ_SKIP_ENGINE_SETUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:app
      - run: npm run build:app
      # Bundle budgets per route (FE-045): fails when a route's initial JS grows past apps/app/bundle-budgets.json.
      - run: npm run bundle:check -w @ifc-boq/app

  engine:
    # Every Python the engine supports (engine/pyproject.toml, review B-09); 3.12 is the one the pilot's
    # engine image runs. The matrix legs run in parallel and all three gate the deploy.
    name: Engine tests on Python ${{ matrix.python }} (incl. Duplex acceptance)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        env:
          IFC_BOQ_PYTHON: python
      - run: npm run test:engine
      # Review B-04: the review's independent checks as gates. Six small public samples (licence-clean,
      # SHA-256 checked by fetch-samples.sh), cached by the script that pins them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/review/_samples
          key: review-samples-${{ hashFiles('docs/review/tools/fetch-samples.sh') }}-S01-S05-S09
      - run: bash docs/review/tools/fetch-samples.sh --only=S01,S02,S03,S04,S05,S09
      - name: Independent quantity checks (verify-quantities, strict)
        run: docs/review/tools/verify-quantities --only S01 S02 S03 S04 S05 S09 --strict
      - name: Engine output equals the review baseline on the small samples
        run: docs/review/tools/compare-baseline --layer engine --only S01-default S02-default S03-default S04-default S05-default S09-default

  workbooks:
    # Review B-11 (F12-AC1): the workbooks boqlet hands over, opened in LibreOffice. A working BoQ, a saved
    # version and the change report are printed to PDF and saved again with every formula recalculated; the
    # recalculated amounts, subtotals and total must equal the engine's (engine/tests/test_export_libreoffice.py).
    name: Exported workbooks in LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install LibreOffice Calc (headless)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc-nogui
          soffice --version
      - run: python -m pip install -r engine/requirements.txt -e ./engine
      - name: Workbooks converted and recalculated by LibreOffice
        working-directory: engine
        run: python -m pytest -q -m libreoffice
        env:
          # Fail, not skip, if soffice is missing.
          BOQLET_REQUIRE_LIBREOFFICE: "1"

  audit:
    # Known vulnerabilities in what ships (review B-09): the app's and the API client's production npm
    # dependencies, and the engine's runtime requirements as pip resolves them today. A finding fails the
    # job and so the deploy; fix by upgrading (Dependabot opens the PRs, .github/dependabot.yml).
    name: Dependency audit (npm, pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: pip-audit (engine runtime requirements)
        run: |
          python -m pip install pip-audit==2.10.1
          # The lines above "# dev" are the runtime; the dev tools (pytest, hypothesis) never ship.
          sed '/^# dev/,$d' engine/requirements.txt > "$RUNNER_TEMP/engine-runtime.txt"
          pip-audit --requirement "$RUNNER_TEMP/engine-runtime.txt" --progress-spinner off

  local:
    # The local backend (ops/local, docs/development/local-setup.md) builds, starts and works end to end:
    # sign-up, upload to object storage, engine parse, BoQ run. A deploy gate since review B-09.
    name: Local backend stack (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm run local:up
      - run: npm run local:check
      - if: failure()
        run: docker compose -f ops/local/compose.yaml logs --tail 300

  rollback:
    name: The previous release's API on the current schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build this revision's API and the previous release's
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^)
          echo "previous release: $previous"
          docker build --tag boqlet-api:current --file services/api/Dockerfile .
          git worktree add /tmp/previous "$previous"
          docker build --tag boqlet-api:previous --file /tmp/previous/services/api/Dockerfile /tmp/previous
      # TF-186: a deploy can be rolled back to the previous image after this revision's migrations ran.
      - run: bash scripts/ci-rollback-check.sh boqlet-api:current boqlet-api:previous

  deploy:
    name: Deploy Boqlet pilot
    # Since the v1 release (FE-047) the one environment (P51) deploys from main; v_1 is kept as it was.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Every job above (review B-09): CI is the only gate before the only environment (P51).
    needs: [api, contract, typecheck, engine, workbooks, audit, local, rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: boqlet-pilot
    concurrency:
      group: boqlet-pilot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package the verified revision
        run: |
          docker build --tag "boqlet-web:$GITHUB_SHA" --file ops/pilot/web.Dockerfile .
          docker build --tag "boqlet-api:$GITHUB_SHA" --file services/api/Dockerfile .
          docker build --tag "boqlet-engine:$GITHUB_SHA" --file ops/pilot/engine.Dockerfile .
      - name: Deploy the image set
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.BOQLET_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.BOQLET_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ vars.BOQLET_DEPLOY_TARGET }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_TARGET"
          # Skip only when a newer push to main supersedes this one (TF-001: this compared with v_1).
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            printf 'Skipped superseded revision %s\n' "$GITHUB_SHA"
            exit 0
          fi
          umask 077
          custody=$(mktemp -d)
          trap 'rm -rf -- "$custody"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$custody/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$custody/known_hosts"
          docker save "boqlet-web:$GITHUB_SHA" "boqlet-api:$GITHUB_SHA" "boqlet-engine:$GITHUB_SHA" |
            gzip -1 |
            ssh -T -i "$custody/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$custody/known_hosts" \
              -- "$DEPLOY_TARGET" "deploy $GITHUB_SHA"
