  /diffs/{diffId}/elements:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
      tags: [diffs]
      operationId: listDiffElements
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ElementChange" } }
                  nextCursor: { type: [string, "null"] }
  /diffs/{diffId}/export:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    post:
      tags: [exports]
      operationId: exportDiff
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }

  # ───────────────────────────── exports ─────────────────────────────
  /exports/{exportId}:
    parameters: [{ $ref: "#/components/parameters/ExportId" }]
    get:
      tags: [exports]
      operationId: getExport
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Export" } } } }
  /exports/{exportId}/download:
    parameters: [{ $ref: "#/components/parameters/ExportId" }]
    get:
      tags: [exports]
      operationId: downloadExport
      responses:
        "302": { description: Redirect to a signed URL }

  # ───────────────────────────── jobs, events, notifications ─────────────────────────────
  /jobs/{jobId}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [jobs]
      operationId: getJob
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
  /jobs/{jobId}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      tags: [jobs]
      operationId: cancelJob
      responses:
        "200": { description: Cancel requested, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      description: Server-Sent Events. Event names and payloads in conventions.md (`job.progress`, `job.finished`, `notification.created`, `entity.changed`, `boq.line_edited` (BoqLineEdited), `boq.presence` (BoqPresence)).
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unreadCount: { type: integer }
                  nextCursor: { type: [string, "null"] }
  /notifications/{notificationId}/read:
    parameters: [{ $ref: "#/components/parameters/NotificationId" }]
    post:
      tags: [notifications]
      operationId: markNotificationRead
      responses:
        "204": { description: OK }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      responses:
        "204": { description: OK }

  # ───────────────────────────── sessions (F01 §10, BR-54) ─────────────────────────────
  /auth/sign-in:
    post:
      tags: [auth]
      operationId: signInWithPassword
      security: []
      description: >-
        Native sign-in (P50, F01 §10). Checks the password and opens the account's session in one
        step: `201` sets the opaque `boqlet_session` cookie (Secure, HttpOnly, SameSite=Lax, path
        `/api/v1`) and returns the session. `409 session_active` when another session is active,
        unless `takeover` is true. The request must come from the app's exact origin. Attempts are
        throttled per source and per email (`429 auth_throttled`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, deviceLabel]
              properties:
                email: { type: string, maxLength: 254, description: "at most 254 characters, else `400 invalid_body`" }
                password: { type: string, maxLength: 256 }
                deviceLabel: { type: string, maxLength: 120 }
                takeover: { type: boolean, default: false }
      responses:
        "201": { description: Signed in; the session cookie is set, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Wrong email or password (`unauthenticated`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Not from the app's origin (`invalid_origin`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: This backend doesn't run native sign-in (`native_auth_disabled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Another session is active, content: { application/json: { schema: { $ref: "#/components/schemas/SessionConflict" } } } }
        "429": { description: Too many attempts (`auth_throttled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/set-password:
    post:
      tags: [auth]
      operationId: setPassword
      security: []
      description: >-
        Sets the password (P50) from a token: a one-hour setup or reset link issued on the server,
        or a pending organisation invitation (the person then signs in and accepts it). A setup or
        reset link is consumed; a reset ends the account's active sessions. The password is 15 to
        128 characters, the name at most 120. `400 invalid_setup` for a used, expired or unknown
        token or a password or name out of range.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string, maxLength: 64 }
                password: { type: string, maxLength: 256 }
                name: { type: [string, "null"], maxLength: 120 }
      responses:
        "204": { description: Password set }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not from the app's origin (`invalid_origin`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: This backend doesn't run native sign-in (`native_auth_disabled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts (`auth_throttled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/sign-up:
    get:
      tags: [auth]
      operationId: getSignUpStatus
      security: []
      description: Whether anyone may create an account (P57, the platform setting `publicSignUp`).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignUpStatus" } } } }
        "404": { description: This backend doesn't run native sign-in (`native_auth_disabled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      tags: [auth]
      operationId: requestSignUp
      security: []
      description: >-
        Public sign-up (P57). Emails the address a one-hour link to set a password
        (`/sign-up?token=…`), which proves the address; the account is made when the password is
        set, and its first org starts on the default plan. An address that already has an account
        gets an email saying so instead. The answer is `202` either way, so it doesn't tell which
        addresses have accounts. Basic bot protection: a filled `website` (a field people don't
        see) or a form sent in under 3 seconds (`elapsedMs`) is accepted with `202` and nothing is
        sent. Throttled per source and per email (`429 auth_throttled`). `403 sign_up_closed`
        while public sign-up is off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, elapsedMs]
              properties:
                email: { type: string, maxLength: 254 }
                locale: { type: string, maxLength: 64, description: "the browser's language, for the email" }
                website: { type: string, maxLength: 200, description: "left empty by people (hidden in the form)" }
                elapsedMs: { type: integer, minimum: 0, description: "how long the form was open before it was sent" }
      responses:
        "202": { description: Accepted; an email is on its way when the address can sign up }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: "Public sign-up is off (`sign_up_closed`), or not from the app's origin (`invalid_origin`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: This backend doesn't run native sign-in (`native_auth_disabled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts (`auth_throttled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      security: []
      description: >-
        Self-service password reset (P57). Emails an account with a password a one-hour reset link
        (`/sign-up?token=…&reset=1`); setting the new password ends the account's active session.
        The answer is `202` whether or not the address has an account. Throttled per source and per
        email (`429 auth_throttled`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "202": { description: Accepted; an email is on its way when the address has an account }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { description: Not from the app's origin (`invalid_origin`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: This backend doesn't run native sign-in (`native_auth_disabled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { description: Too many attempts (`auth_throttled`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions:
    post:
      tags: [sessions]
      operationId: openSession
      description: Called after the auth adapter signs the user in. `409 session_active` when another session of the account is active, unless `takeover` is true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceLabel]
              properties:
                deviceLabel: { type: string, maxLength: 120 }
                takeover: { type: boolean, default: false }
      responses:
        "201": { description: Session opened, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "409": { description: Another session is active, content: { application/json: { schema: { $ref: "#/components/schemas/SessionConflict" } } } }
  /sessions/current:
    get:
      tags: [sessions]
      operationId: getCurrentSession
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    delete:
      tags: [sessions]
      operationId: closeCurrentSession
      responses:
        "204": { description: Signed out }

  # ───────────────────────────── line edits in bulk, Excel round-trip (F06, F12) ─────────────────────────────
  /boqs/{boqId}/presence:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    put:
      tags: [adjustments]
      operationId: putBoqPresence
      description: >-
        I have this BoQ open (F06 §14, P31), and the line I'm editing if any. Sent on opening, on
        changing the line, and every 20 s; presence ends 45 s after the last call or on DELETE.
        Changes reach everyone with the BoQ open as SSE `boq.presence`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lineKey: { type: [string, "null"], maxLength: 4000, description: "the line being edited; null or missing for none" }
      responses:
        "200": { description: Who has the BoQ open now, content: { application/json: { schema: { $ref: "#/components/schemas/BoqPresence" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [adjustments]
      operationId: leaveBoqPresence
      responses:
        "204": { description: Left }
  /boqs/{boqId}/overrides/batch:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [adjustments]
      operationId: applyLineEdits
      description: Apply several line edits and manual lines at once (bulk actions, Excel import review). All or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                overrides: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/LineOverrideInput" } }
                removeOverrideLineKeys: { type: array, maxItems: 20000, items: { type: string, maxLength: 4000 } }
                manualItems: { type: array, maxItems: 20000, items: { $ref: "#/components/schemas/ManualItemInput" } }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  overrides: { type: array, items: { $ref: "#/components/schemas/LineOverride" } }
                  manualItems: { type: array, items: { $ref: "#/components/schemas/ManualItemRecord" } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/edits-import:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [exports]
      operationId: importBoqEdits
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      description: Upload an edited BoQ Excel (F12). Starts an `import_boq_edits` job whose output is an `EditsImportReport`; nothing is applied until the user applies the reviewed edits through `applyLineEdits`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }

  /jobs/{jobId}/edits-import-report:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      tags: [exports]
      operationId: getEditsImportReport
      description: The review list of a finished `import_boq_edits` job.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EditsImportReport" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────────────────────── preset Excel templates (F10 §14) ─────────────────────────────
  /presets/{presetId}/template.xlsx:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: downloadPresetTemplate
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [draft, latest, empty], default: draft } }
      responses:
        "302": { description: Redirect to a signed URL of the generated workbook }
  /presets/{presetId}/template-import:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: importPresetTemplate
      description: Read a filled-in template. Returns the proposed draft, the changes against the current draft and the problems; saves nothing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Proposed draft, content: { application/json: { schema: { $ref: "#/components/schemas/TemplateImportResult" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────────── share links (F18) ─────────────────────────────
  /boqs/{boqId}/share-links:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [sharing]
      operationId: listShareLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareLink" } } } } }
    post:
      tags: [sharing]
      operationId: createShareLink
      description: |
        `409 boq_archived` on an archived BoQ (restore it first); `409 public_links_off`; `409 no_run` for a pinned version without a run.
        A pinned link to a version that is not saved (not `issued`; review A-46, DEC-42): `403 saved_versions_only` when the org
        has `shareOnlySavedVersions`; `403 approval_required_for_share` (`details.required: approver`) when approval is on and the
        caller is not the project's lead or an approver. The revision's `permissions.shareWorking` says whether the caller may.
        Links made before stay as they are.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ShareLinkCreate" } } }
      responses:
        "201": { description: Created; the only response that contains the full URL with its token, content: { application/json: { schema: { $ref: "#/components/schemas/ShareLinkCreated" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /share-links/{shareLinkId}:
    parameters: [{ $ref: "#/components/parameters/ShareLinkId" }]
    patch:
      tags: [sharing]
      operationId: updateShareLink
      description: "`409 boq_archived` on an archived BoQ's link (revoking it still works); `409 invalid_transition` on a revoked link."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                include: { $ref: "#/components/schemas/ShareInclude" }
                expiresAt: { type: [string, "null"], format: date-time }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ShareLink" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [sharing]
      operationId: revokeShareLink
      responses:
        "204": { description: Revoked }
  /orgs/{orgId}/share-links:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [sharing]
      operationId: listOrgShareLinks
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ShareLink" } } } } }
  /public/shares/{token}:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShare
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicShare" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/shares/{token}/lines:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: listPublicShareLines
      security: []
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinesPage" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/shares/{token}/lines/by-key:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareLine
      security: []
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK (only when the link includes line detail), content: { application/json: { schema: { $ref: "#/components/schemas/LineDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/shares/{token}/scene:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareScene
      security: []
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid }, description: "One of PublicShare.modelVersionIds (a BoQ of several models, F18 edge cases); default the first" }
      responses:
        "200": { description: OK (only when the link includes the viewer), content: { application/json: { schema: { $ref: "#/components/schemas/SceneIndex" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/shares/{token}/geometry/{versionId}:
    parameters: [{ $ref: "#/components/parameters/Token" }, { $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [public]
      operationId: getPublicShareGeometry
      security: []
      responses:
        "302": { description: Redirect to a short-lived signed URL of geometry.glb }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /public/shares/{token}/export:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [public]
      operationId: getPublicShareExport
      security: []
      responses:
        "302": { description: Redirect to a short-lived signed URL of the Excel (only when included) }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ───────────────────────────── platform admin (F19) ─────────────────────────────
  /admin/overview:
    get:
      tags: [admin]
      operationId: adminOverview
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOverview" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/funnel:
    get:
      tags: [admin]
      operationId: adminFunnel
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFunnel" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs:
    get:
      tags: [admin]
      operationId: adminListOrgs
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: plan, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "the org's status (active, suspended) or its subscription status (active, trialing)" }
        - { name: country, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: signal, in: query, schema: { type: string, enum: [hit_limit, inactive_30d, trial_ending_7d, stuck_in_setup] } }
        - { name: stuckAt, in: query, schema: { $ref: "#/components/schemas/AdminFunnelStep" }, description: "orgs that reached the step before this one and not this one (F19 §2, a funnel step clicked)" }
        - { name: q, in: query, schema: { type: string }, description: "name, slug or owner email" }
        - { name: sort, in: query, schema: { type: string }, description: "a column of AdminOrgRow (name, planId, createdAt, lastActivityAt, limitHits30d, seats, activeProjects, processingMinutes), `-` in front for descending" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminOrgRow" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs.csv:
    get:
      tags: [admin]
      operationId: adminExportOrgs
      description: The orgs table as CSV, with the same filters and sort as `adminListOrgs`.
      parameters:
        - { name: plan, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: "the org's status (active, suspended) or its subscription status (active, trialing)" }
        - { name: country, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: signal, in: query, schema: { type: string, enum: [hit_limit, inactive_30d, trial_ending_7d, stuck_in_setup] } }
        - { name: stuckAt, in: query, schema: { $ref: "#/components/schemas/AdminFunnelStep" }, description: "orgs that reached the step before this one and not this one (F19 §2, a funnel step clicked)" }
        - { name: q, in: query, schema: { type: string }, description: "name, slug or owner email" }
        - { name: sort, in: query, schema: { type: string }, description: "a column of AdminOrgRow (name, planId, createdAt, lastActivityAt, limitHits30d, seats, activeProjects, processingMinutes), `-` in front for descending" }
      responses:
        "200": { description: CSV of the orgs table, content: { text/csv: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [admin]
      operationId: adminGetOrg
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: adminUpdateOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                tags: { type: [array, "null"], maxItems: 50, items: { type: string, maxLength: 64 } }
                status: { type: string, enum: [active, suspended] }
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/subscription:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    put:
      tags: [admin]
      operationId: adminSetSubscription
      description: Change plan or trial through the `manual` billing provider (F14). Audited, visible in the org's audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                planId: { type: string, maxLength: 64 }
                trialEndsAt: { type: [string, "null"], format: date-time }
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/entitlement-overrides:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    put:
      tags: [admin]
      operationId: adminSetEntitlementOverrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overrides, reason]
              properties:
                overrides: { type: object, additionalProperties: true, description: "entitlement name → value; null removes the override" }
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminOrgDetail" } } } }
  /admin/orgs/{orgId}/notes:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [admin]
      operationId: adminListNotes
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminNote" } } } } }
    post:
      tags: [admin]
      operationId: adminAddNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminNote" } } } }
  /admin/plans:
    get:
      tags: [admin]
      operationId: adminListPlans
      description: Every plan, hidden ones too, with the keys a plan may set and the platform currency (P57).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlans" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [admin]
      operationId: adminCreatePlan
      description: A new plan. Audited (`plan.created`). `409 plan_exists` when the id is taken.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlanCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlan" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: The id is taken (`plan_exists`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/plans/{planId}:
    parameters:
      - { name: planId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    put:
      tags: [admin]
      operationId: adminUpdatePlan
      description: >-
        Replaces the plan's settings; every org on it gets the new limits at once (P57). Nothing is
        deleted: an org over a new limit keeps what it has, and new use past it is refused.
        Audited (`plan.updated`, before and after). `409 default_plan_required` when the default
        plan would stop being default without another taking its place.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlanInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlan" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The default plan must stay default (`default_plan_required`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [admin]
      operationId: adminDeletePlan
      description: Deletes a plan no org is on. Audited (`plan.deleted`). `409 plan_in_use` while orgs are on it, `409 default_plan_required` for the default plan.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AdminPlanDelete" } } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Orgs are on the plan (`plan_in_use`) or it is the default (`default_plan_required`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /admin/plans/{planId}/impact:
    parameters:
      - { name: planId, in: path, required: true, schema: { type: string, maxLength: 64 } }
    post:
      tags: [admin]
      operationId: adminPlanImpact
      description: What saving these entitlements would do to the orgs on the plan, before it is saved. Changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entitlements]
              properties:
                entitlements: { type: object, additionalProperties: true }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlanImpact" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/settings:
    get:
      tags: [admin]
      operationId: adminGetSettings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformSettings" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [admin]
      operationId: adminUpdateSettings
      description: The platform's currency and whether public sign-up is open (P57). Audited (`platform.settings_changed`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                publicSignUp: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PlatformSettings" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUserRow" } }
                  nextCursor: { type: [string, "null"] }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/users/{userId}/session:
    parameters: [{ $ref: "#/components/parameters/UserId" }]
    delete:
      tags: [admin]
      operationId: adminEndUserSession
      responses:
        "204": { description: The user's active session ended }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/health:
    get:
      tags: [admin]
      operationId: adminHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  failedJobsPerDay: { type: array, items: { type: object, properties: { date: { type: string, format: date }, count: { type: integer } } } }
                  jobDurationsMs: { type: object, additionalProperties: { type: object, properties: { p50: { type: number }, p95: { type: number } } } }
                  billingWebhookFailures: { type: integer }
                  emailBounces: { type: integer }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: boqlet_session
      description: >-
        The opaque application session (P50). Native sign-in (`POST /auth/sign-in`) sets it as an
        HttpOnly, SameSite=Lax cookie on `/api/v1`; state-changing requests must also carry the
        exact app `Origin`. One active session per account (`POST /sessions`, BR-54).
    bearer:
      type: http
      scheme: bearer
      description: >-
        OIDC access token, only when Java runs with an OIDC issuer (the Keycloak rollback, and the
        test harness's token decoder); it is sent together with the session cookie. Refused under
        native sign-in.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: >-
        A key chosen by the client for this request (api-conventions.md "Idempotency"). The same key
        from the same user on the same operation within 24 hours answers the first response again
        instead of starting another job or sending another email (TF-073).
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    Token: { name: token, in: path, required: true, schema: { type: string } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    ModelId: { name: modelId, in: path, required: true, schema: { type: string, format: uuid } }
    VersionId: { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
    PresetId: { name: presetId, in: path, required: true, schema: { type: string, format: uuid } }
    PresetVersionId: { name: presetVersionId, in: path, required: true, schema: { type: string, format: uuid } }
    DecisionId: { name: decisionId, in: path, required: true, schema: { type: string, format: uuid } }
    BoqId: { name: boqId, in: path, required: true, schema: { type: string, format: uuid } }
    RevisionId: { name: revisionId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    DiffId: { name: diffId, in: path, required: true, schema: { type: string, format: uuid } }
    OverrideId: { name: overrideId, in: path, required: true, schema: { type: string, format: uuid } }
    ManualItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    NotificationId: { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
    ShareLinkId: { name: shareLinkId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }

  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthenticated:
      description: Not signed in
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: "Too many requests from this address (`rate_limited`); a public share allows 300 a minute per address by default, `BOQLET_PUBLIC_SHARE_REQUESTS_PER_MINUTE` (TF-079)"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    LimitReached:
      description: Plan limit reached
      content: { application/json: { schema: { $ref: "#/components/schemas/LimitError" } } }
    Forbidden:
      description: Not allowed for this role
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found or not visible to the caller
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Blocked by state (code says why)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    JobAccepted:
      description: Job created
      content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } }

  schemas:
    # ── sessions (F01 §10) ──
    Session:
      type: object
      required: [id, status, deviceLabel, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended, replaced, expired] }
        deviceLabel: { type: string }
        place: { type: string }
        lastSeenAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SessionConflict:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [activeSession]
          properties:
            activeSession: { $ref: "#/components/schemas/Session" }

    # ── line edits import, preset templates ──
    EditsImportReport:
      type: object
      description: Output of an `import_boq_edits` job (F12). Proposals only.
      required: [overrides, manualItems, problems]
      properties:
        overrides:
          type: array
          items:
            type: object
            required: [edit, change]
            properties:
              edit: { $ref: "#/components/schemas/LineOverrideInput" }
              change: { type: string, enum: [quantity, description, unit, moved, excluded, mixed] }
              row: { type: integer }
        manualItems:
          type: array
          items:
            type: object
            properties:
              item: { $ref: "#/components/schemas/ManualItemInput" }
              row: { type: integer }
        problems:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              sheet: { type: string }
              row: { type: integer }
              column: { type: string }
              message: { type: string }
    TemplateImportResult:
      type: object
      required: [doc, changes, problems]
      properties:
        doc: { type: object, additionalProperties: true, description: The proposed draft document (engine shape of the preset kind) }
        changes:
          type: array
          items:
            type: object
            required: [what, summary]
            properties:
              what: { type: string, enum: [answer, code, item_text, code_mapping, name, other] }
              summary: { type: string }
              before: {}
              after: {}
        problems:
          type: array
          items:
            type: object
            required: [message]
            properties:
              sheet: { type: string }
              row: { type: integer }
              column: { type: string }
              message: { type: string }

    # ── share links (F18) ──
    ShareInclude:
      type: object
      properties:
        lineDetail: { type: boolean, default: true }
        viewer: { type: boolean, default: true }
        log: { type: boolean, default: false }
        excel: { type: boolean, default: false }
        groupBy: { type: string, maxLength: 200, description: classification id }
    ShareLinkCreate:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [pinned, latest_issued] }
        revisionId: { type: string, format: uuid, description: for pinned links; its current run is pinned }
        include: { $ref: "#/components/schemas/ShareInclude" }
        label: { type: string, maxLength: 200 }
        expiresAt: { type: [string, "null"], format: date-time }
    ShareLink:
      type: object
      required: [id, boqId, mode, include, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        mode: { type: string, enum: [pinned, latest_issued] }
        runId: { type: [string, "null"], format: uuid }
        include: { $ref: "#/components/schemas/ShareInclude" }
        label: { type: string }
        status: { type: string, enum: [active, revoked, expired, suspended] }
        expiresAt: { type: [string, "null"], format: date-time }
        views: { type: integer }
        lastViewedAt: { type: [string, "null"], format: date-time }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
        projectId: { type: string, format: uuid }
        projectName: { type: string, description: For the org's list (F18 §3) }
        boqName: { type: string }
        revisionLabel: { type: [string, "null"], description: "The version a pinned link shows, or the latest saved one; null when a following link has nothing saved yet" }
        permissions: { $ref: "#/components/schemas/Permissions" }
    ShareLinkCreated:
      allOf:
        - $ref: "#/components/schemas/ShareLink"
        - type: object
          required: [url]
          properties:
            url: { type: string, description: "Full public URL with the token. Shown once: the token is stored hashed." }
    PublicShare:
      type: object
      description: What a public visitor sees (BR-56). No member names, decisions, questions, vendors or prices.
      required: [firmName, projectName, boqName, revisionLabel, revisionStatus, runAt, include]
      properties:
        firmName: { type: string }
        projectName: { type: string }
        boqName: { type: string }
        revisionLabel: { type: [string, "null"], description: "null: a link that follows the latest saved version, and none is saved yet (F18 §1: shows nothing until one is)" }
        revisionStatus: { type: [string, "null"], enum: [draft, in_review, approved, issued, null] }
        runAt: { type: [string, "null"], format: date-time }
        systems: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }, description: The run's classifications (names for grouping) }
        include: { $ref: "#/components/schemas/ShareInclude" }
        modelVersionIds: { type: array, items: { type: string, format: uuid }, description: for the viewer when included }
        madeWithBadge: { type: boolean }
        numberFormat:
          type: object
          description: "The firm's separators (`OrgSettings.numberFormat`), so the page formats numbers like the firm (TF-021)"
          properties:
            decimal: { type: string, enum: [".", ","] }
            thousands: { type: string, enum: [",", ".", " ", " ", "'", ""] }
        dateFormat: { type: string, description: "The firm's date format (`OrgSettings.dateFormat`), e.g. dd.MM.yyyy" }

    # ── platform admin (F19) ──
    AdminOverview:
      type: object
      properties:
        period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
        tiles:
          type: object
          description: "name → {value, previous, series[]}: signUps, newOrgs, activeOrgs, payingOrgs, revenue, seatsUsed, seatsAvailable, activeProjects, modelsParsed, runs, processingMinutes, exports, savedVersions, confirmedBoqs, shareLinkViews; modules add theirs (admin.metrics)"
          additionalProperties:
            type: object
            properties:
              value: { type: [number, "null"] }
              previous: { type: [number, "null"] }
              series: { type: array, items: { type: number } }
        orgsByPlan: { type: object, additionalProperties: { type: integer } }
    AdminFunnel:
      type: object
      properties:
        steps:
          type: array
          items:
            type: object
            required: [step, orgs]
            properties:
              step: { $ref: "#/components/schemas/AdminFunnelStep" }
              orgs: { type: integer }
              conversionPct: { type: number }
              medianHoursFromPrevious: { type: [number, "null"] }
        cohorts:
          type: array
          items:
            type: object
            properties:
              week: { type: string }
              counts: { type: array, items: { type: integer } }
    BoqPresence:
      type: object
      required: [boqId, users]
      description: The SSE event `boq.presence` carries the same shape.
      properties:
        boqId: { type: string, format: uuid }
        users:
          type: array
          items:
            type: object
            required: [userId, name]
            properties:
              userId: { type: string, format: uuid }
              name: { type: string }
              lineKey: { type: [string, "null"] }
    BoqLineEdited:
      type: object
      required: [boqId, lineKeys, by, at]
      description: "SSE `boq.line_edited` (F06 §14): a saved edit of these lines, to everyone with the BoQ open."
      properties:
        boqId: { type: string, format: uuid }
        lineKeys: { type: array, items: { type: string } }
        by: { $ref: "#/components/schemas/UserRef" }
        at: { type: string, format: date-time }
    AdminFunnelStep:
      type: string
      enum: [signed_up, org_created, setup_done, first_model_ready, first_boq, first_saved_version, first_export_or_share]
    AdminOrgRow:
      type: object
      required: [id, name, planId, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        planId: { type: string }
        status: { type: string }
        subscriptionStatus: { type: string }
        trialEndsAt: { type: [string, "null"], format: date-time }
        seats: { type: object, properties: { used: { type: integer }, max: { type: [integer, "null"] } } }
        activeProjects: { type: object, properties: { used: { type: integer }, max: { type: [integer, "null"] } } }
        processingMinutes: { type: object, properties: { used: { type: number }, max: { type: [number, "null"] } } }
        limitHits30d: { type: integer }
        lastActivityAt: { type: [string, "null"], format: date-time }
        ownerEmail: { type: string }
        tags: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
    AdminOrgDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOrgRow"
        - type: object
          description: Metadata and counts only (BR-57).
          properties:
            settings: { $ref: "#/components/schemas/OrgSettings" }
            provider: { type: string }
            currentPeriodEnd: { type: [string, "null"], format: date-time }
            entitlements: { type: object, additionalProperties: true }
            overrides: { type: object, additionalProperties: true }
            planHistory: { type: array, items: { type: object, properties: { planId: { type: string }, at: { type: string, format: date-time }, by: { type: string } } } }
            members:
              type: array
              items:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  name: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/OrgRole" }
                  lastActiveAt: { type: [string, "null"], format: date-time }
                  activeSession: { type: boolean }
            counts: { type: object, additionalProperties: { type: integer }, description: "projectsActive, projectsArchived, models, versions, boqs, confirmedBoqs, runs, exports, shareLinks; plus module counters" }
            usageByMonth: { type: array, items: { type: object, properties: { month: { type: string }, kind: { type: string }, minutes: { type: number } } } }
            limitEvents: { type: array, items: { type: object, properties: { limit: { type: string }, current: { type: number }, max: { type: number }, action: { type: string }, at: { type: string, format: date-time } } } }
            setup: { $ref: "#/components/schemas/OrgSetup" }
    AdminUserRow:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        orgs: { type: array, items: { type: object, properties: { orgId: { type: string, format: uuid }, orgName: { type: string }, role: { $ref: "#/components/schemas/OrgRole" } } } }
        lastSignInAt: { type: [string, "null"], format: date-time }
        activeSession: { $ref: "#/components/schemas/Session" }
        createdAt: { type: string, format: date-time }
    AdminNote:
      type: object
      required: [id, text, author, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string }
        author: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    EntitlementKey:
      type: object
      description: A limit or feature the backend enforces (core, or registered by a module). Plans and overrides can only set these.
      required: [key, type]
      properties:
        key: { type: string }
        type: { type: string, enum: [number, boolean], description: "number: a non-negative whole number, left out for unlimited; boolean: a feature on or off (left out is off)" }
    AdminPlan:
      type: object
      required: [id, name, description, public, defaultPlan, position, entitlements, orgCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        public: { type: boolean, description: "shown to customers on the billing page; a hidden plan is assigned by the platform admin only" }
        defaultPlan: { type: boolean, description: "the plan every new org starts on (one plan at a time)" }
        position: { type: integer, description: "the order of the plans, lowest first" }
        price: { $ref: "#/components/schemas/PlanPrice" }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
        orgCount: { type: integer, description: "orgs on this plan now" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminPlans:
      type: object
      required: [currency, entitlementKeys, plans]
      properties:
        currency: { type: string }
        entitlementKeys: { type: array, items: { $ref: "#/components/schemas/EntitlementKey" } }
        plans: { type: array, items: { $ref: "#/components/schemas/AdminPlan" } }
    AdminPlanPriceInput:
      type: object
      required: [amount, period]
      properties:
        amount: { type: number, minimum: 0, maximum: 1000000000 }
        period: { type: string, enum: [month, year] }
    AdminPlanInput:
      type: object
      description: >-
        Everything a plan holds; a save replaces all of it and applies to every org on the plan at
        once (P57). `entitlements` may hold only the keys of `AdminPlans.entitlementKeys`: a number
        is a non-negative whole number (left out: unlimited), a feature true or false.
      required: [name, public, defaultPlan, position, entitlements, reason]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        public: { type: boolean }
        defaultPlan: { type: boolean, description: "true makes this the default plan (the previous default stops being it); the default plan can't be unset, only replaced" }
        position: { type: integer, minimum: 0, maximum: 10000 }
        price: { $ref: "#/components/schemas/AdminPlanPriceInput" }
        entitlements: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 1, maxLength: 4000 }
    AdminPlanCreate:
      type: object
      required: [id, name, public, defaultPlan, position, entitlements, reason]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$", description: "lowercase letters, digits and dashes, not `new`; fixed once made" }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        public: { type: boolean }
        defaultPlan: { type: boolean }
        position: { type: integer, minimum: 0, maximum: 10000 }
        price: { $ref: "#/components/schemas/AdminPlanPriceInput" }
        entitlements: { type: object, additionalProperties: true }
        reason: { type: string, minLength: 1, maxLength: 4000 }
    AdminPlanDelete:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 4000 }
    PlanImpact:
      type: object
      required: [orgs, affected]
      properties:
        orgs: { type: integer, description: "orgs on the plan" }
        affected:
          type: object
          additionalProperties: { type: integer }
          description: "entitlement key → orgs the change affects: for a number, orgs whose use is over the new limit (they keep everything, new use is refused); for a feature, orgs that lose it. Overrides are taken into account"
    PlatformSettings:
      type: object
      required: [currency, publicSignUp]
      properties:
        currency: { type: string, description: "ISO 4217 code of every plan price" }
        publicSignUp: { type: boolean, description: "anyone may create an account at /sign-up (P57); off: accounts come only from setup links and invitations" }
    SignUpStatus:
      type: object
      required: [open]
      properties:
        open: { type: boolean }

    # ── common ──
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, description: "machine code, e.g. revision_locked, invalid_transition, deadline_passed" }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    LimitError:
      description: "`402 limit_reached`: the limit, its current use and its maximum are in `details` (TF-072)"
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required: [details]
          properties:
            details:
              type: object
              required: [limit, current, max]
              additionalProperties: true
              properties:
                limit: { type: string, description: "the entitlement, e.g. activeProjects, seats, processingMinutesPerMonth" }
                current: { type: number }
                max: { type: number }
    UserRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
    RedirectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    UploadInstructions:
      type: object
      required: [method, url]
      properties:
        method: { type: string, enum: [PUT] }
        url: { type: string, description: Signed URL (single-part) }
        headers: { type: object, additionalProperties: { type: string } }
        expiresAt: { type: string, format: date-time }
        parts:
          type: array
          description: "Multipart upload URLs for files over 100 MiB: PUT bytes `[(partNumber - 1) * partSizeBytes, partNumber * partSizeBytes)` of the file to each part's URL, keep each answer's `ETag` header and send them all to `completeModelUpload`. `url` is then the first part's URL."
          items:
            type: object
            required: [partNumber, url]
            properties:
              partNumber: { type: integer }
              url: { type: string }
        partSizeBytes: { type: integer }
    Permissions:
      type: object
      description: What the caller may do on this resource (UI hints; the API enforces anyway)
      additionalProperties: { type: boolean }

    # ── identity ──
    User:
      type: object
      required: [id, email, name, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        locale: { type: string }
        platformRole: { type: string, enum: [admin], description: Operators of the product only (F19) }
    Me:
      type: object
      required: [user, memberships, preferences]
      properties:
        user: { $ref: "#/components/schemas/User" }
        preferences: { $ref: "#/components/schemas/UserPreferences" }
        memberships:
          type: array
          items:
            type: object
            required: [org, role]
            properties:
              org: { $ref: "#/components/schemas/Org" }
              role: { $ref: "#/components/schemas/OrgRole" }
        session: { $ref: "#/components/schemas/Session" }
        modules:
          type: object
          description: Fields added by installed modules under their key (e.g. `pricing`); empty when none are installed (P36).
          additionalProperties: { type: object, additionalProperties: true }
    UserPreferences:
      type: object
      description: The signed-in user's interface preferences, kept on the server so they follow the user to every browser (F06-AC8, Q55).
      additionalProperties: false
      properties:
        notInModelsCollapsed: { type: boolean, description: "the BoQ sheet's 'not in the models' notice is collapsed to its counts line (F06 §12)" }
    OrgRole: { type: string, enum: [owner, admin, library_editor, member] }
    Org:
      type: object
      required: [id, name, slug, settings, planId]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        planId: { type: string }
        settings: { $ref: "#/components/schemas/OrgSettings" }
        setup: { $ref: "#/components/schemas/OrgSetup" }
        status: { type: string, enum: [active, suspended], description: "suspended by a platform admin (F19): read-only, no new jobs; writes answer 409 org_suspended" }
        createdAt: { type: string, format: date-time }
    OrgSetup:
      type: object
      description: Setup wizard progress (F16). The drafts it created are ordinary presets.
      required: [status, step, updatedAt]
      properties:
        status: { type: string, enum: [in_progress, done] }
        step: { type: string, enum: [start, measure, items, names, review] }
        modelVersionId: { type: string, format: uuid, description: the model version the preview runs on }
        ruleSetPresetId: { type: string, format: uuid }
        classificationPresetId: { type: string, format: uuid }
        dictionaryPresetId: { type: string, format: uuid }
        startedBy: { $ref: "#/components/schemas/UserRef" }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    OrgSetupUpdate:
      type: object
      properties:
        status: { type: string, enum: [in_progress, done] }
        step: { type: string, enum: [start, measure, items, names, review] }
        modelVersionId: { type: [string, "null"], format: uuid }
        ruleSetPresetId: { type: string, format: uuid }
        classificationPresetId: { type: string, format: uuid }
        dictionaryPresetId: { type: string, format: uuid }
    OrgSettings:
      type: object
      properties:
        fourEyes: { type: boolean }
        defaultLocale: { type: string, maxLength: 64 }
        defaultCurrency: { type: string, maxLength: 64 }
        defaultUnitSystem: { type: string, enum: [metric, imperial] }
        defaultCountry: { type: string, maxLength: 64 }
        publicLinksAllowed: { type: boolean, default: true }
        approvalRequired: { type: boolean, default: false, description: "Saving a version needs review and approval (F09 §4, P29). While on, only a project's lead or approvers share versions that are not saved (review A-46)" }
        shareOnlySavedVersions: { type: boolean, description: "Share links show only saved versions, for everyone: a pinned link to a version that is not saved is refused (review A-46). Off when not set (no `default`: a partial settings PATCH would reset it, TF-191)" }
        numberFormat:
          type: object
          description: Overrides the locale's separators (P35)
          properties:
            decimal: { type: string, enum: [".", ","] }
            thousands: { type: string, enum: [",", ".", " ", " ", "'", ""], description: "U+202F (narrow no-break space) is the default for new orgs (F15)" }
        dateFormat: { type: string, maxLength: 64, description: "e.g. dd.MM.yyyy (P35)" }
        defaultLanguage: { type: string, maxLength: 64, description: "en when not set (no `default`: a partial settings PATCH would reset it, TF-191)" }
    OrgCreate:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9-]{3,40}$" }
        settings: { $ref: "#/components/schemas/OrgSettings" }
    OrgUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        slug: { type: string, pattern: "^[a-z0-9-]{3,40}$" }
        settings: { $ref: "#/components/schemas/OrgSettings" }
    Membership:
      type: object
      required: [user, role, createdAt]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/OrgRole" }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
    OrgInvitation:
      type: object
      required: [id, email, role, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        invitedBy: { $ref: "#/components/schemas/UserRef" }
    NotificationPreferences:
      type: object
      properties:
        email:
          type: object
          description: "Category → on/off. Core categories: jobs, versions, reviews, membership, limits; modules add theirs (e.g. pricing)"
          additionalProperties: { type: boolean }

    # ── billing ──
    Entitlements:
      type: object
      description: Core limits and features; modules add their own keys (e.g. pricingModule, openOfferRequests).
      additionalProperties: true
      properties:
        seats: { type: integer }
        activeProjects: { type: integer }
        maxModelVersionMb: { type: integer }
        maxModelsPerBoq: { type: integer }
        processingMinutesPerMonth: { type: integer }
        libraryOrgPresets: { type: integer }
        auditLogRetentionDays: { type: integer }
        ownedOrgsPerUser: { type: integer, description: "how many orgs on this plan one person may own; checked when someone creates an org, which starts on the default plan (P57)" }
        approvalWorkflow: { type: boolean }
        shareLinks: { type: boolean }
        exportWatermark: { type: boolean }
    Plan:
      type: object
      required: [id, name, entitlements]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, description: "a line for the plan card; empty when the platform admin wrote none" }
        price: { $ref: "#/components/schemas/PlanPrice" }
        entitlements: { $ref: "#/components/schemas/Entitlements" }
    PlanPrice:
      type: object
      description: The plan's price as shown to customers, in the platform's one currency (P57). Shown only; no payment provider charges it yet (D7). A plan without `price` shows none.
      required: [amount, currency, period]
      properties:
        amount: { type: number, minimum: 0 }
        currency: { type: string, description: "ISO 4217 code, the platform setting `currency`" }
        period: { type: string, enum: [month, year] }
    EntitlementsResponse:
      type: object
      required: [planId, limits, usage]
      properties:
        planId: { type: string }
        limits: { $ref: "#/components/schemas/Entitlements" }
        usage:
          type: object
          properties:
            seats: { type: integer }
            activeProjects: { type: integer }
            processingMinutesThisMonth: { type: number }
    UsageResponse:
      type: object
      required: [month, processingMinutes, byProject, byKind]
      properties:
        month: { type: string }
        processingMinutes: { type: number }
        byProject:
          type: array
          items:
            type: object
            properties:
              projectId: { type: string, format: uuid }
              projectName: { type: string }
              minutes: { type: number }
        byKind:
          type: object
          additionalProperties: { type: number }
    Subscription:
      type: object
      required: [planId, status, provider]
      properties:
        planId: { type: string }
        status: { type: string, enum: [active, trialing, past_due, cancelled] }
        trialEndsAt: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        provider: { type: string, description: "manual, paddle, ..." }
        plans: { type: array, items: { $ref: "#/components/schemas/Plan" } }

    # ── projects ──
    ProjectRole: { type: string, enum: [lead, estimator, approver, viewer] }
    ProjectDefaults:
      type: object
      properties:
        ruleSetVersionId: { type: [string, "null"], format: uuid }
        classificationVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
    Project:
      type: object
      required: [id, orgId, name, currency, unitSystem, locale, status, defaults, permissions]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        client: { type: string }
        location:
          type: object
          properties:
            address: { type: string }
            country: { type: string }
        currency: { type: string }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string }
        status: { type: string, enum: [active, archived] }
        sample: { type: boolean }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
        defaultPresets:
          type: array
          description: "The presets of `defaults`, each with a newer published version and whether it is archived (review A-44); read-only"
          items: { $ref: "#/components/schemas/PresetInputInfo" }
        projectDictionaryId: { type: string, format: uuid }
        myRole: { $ref: "#/components/schemas/ProjectRole" }
        permissions: { $ref: "#/components/schemas/Permissions" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectListItem:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            counts:
              type: object
              properties:
                models: { type: integer }
                boqs: { type: integer }
                blockingQuestions: { type: integer }
                revisionsInReview: { type: integer }
                confirmedBoqs: { type: integer }
            lastActivityAt: { type: string, format: date-time }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 200 }
        client: { type: string, maxLength: 200 }
        location:
          type: object
          properties:
            address: { type: string, maxLength: 4000 }
            country: { type: string, maxLength: 64 }
        currency: { type: string, maxLength: 64 }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string, maxLength: 64 }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
        sample: { type: string, enum: [duplex], description: Create the sample project instead (FL-1) }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        code: { type: string, maxLength: 200 }
        client: { type: string, maxLength: 200 }
        location:
          type: object
          properties:
            address: { type: string, maxLength: 4000 }
            country: { type: string, maxLength: 64 }
        currency: { type: string, maxLength: 64 }
        unitSystem: { type: string, enum: [metric, imperial] }
        locale: { type: string, maxLength: 64 }
        defaults: { $ref: "#/components/schemas/ProjectDefaults" }
    ProjectMember:
      type: object
      required: [user, role]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/ProjectRole" }
        addedBy: { $ref: "#/components/schemas/UserRef" }
    AttentionItem:
      type: object
      required: [kind, projectId, projectName, title, url]
      properties:
        kind: { type: string, description: "Core kinds: review_requested, needs_input, new_model_version, job_failed, changes_requested; modules add theirs" }
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        title: { type: string, description: i18n params are in `params`; title is a fallback }
        params: { type: object, additionalProperties: true }
        url: { type: string }
        at: { type: string, format: date-time }
    AuditEvent:
      type: object
      required: [id, action, entityType, entityId, at]
      properties:
        id: { type: string, format: uuid }
        actor: { $ref: "#/components/schemas/UserRef" }
        actorKind: { type: string, enum: [user, system, vendor, platform_admin] }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        projectId: { type: [string, "null"], format: uuid }
        data: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        nextCursor: { type: [string, "null"] }

    # ── models ──
    Model:
      type: object
      required: [id, projectId, name, discipline, archived]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        discipline: { type: string }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
        latestVersion: { $ref: "#/components/schemas/ModelVersion" }
        versionCount: { type: integer }
        archived: { type: boolean }
    ModelCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        discipline: { type: string, maxLength: 200, description: "architecture, structure, mep, other federation keys, or 'detect'" }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
    ModelUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        discipline: { type: string, maxLength: 200 }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
    ModelVersionStatus: { type: string, enum: [awaiting_upload, queued, processing, ready, failed] }
    ModelVersion:
      type: object
      required: [id, modelId, number, fileName, sizeBytes, status, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        modelId: { type: string, format: uuid }
        number: { type: integer }
        fileName: { type: string }
        sizeBytes: { type: integer }
        sha256: { type: string }
        status: { $ref: "#/components/schemas/ModelVersionStatus" }
        parseJobId: { type: [string, "null"], format: uuid }
        summary: { $ref: "#/components/schemas/ModelSummary" }
        identicalToVersion: { type: [integer, "null"] }
        error:
          $ref: "#/components/schemas/Error"
          description: "A failed version's error: `code` one of not_ifc, unsupported_schema, corrupt_file, truncated_file, no_project, too_large, parse_timeout, parse_error, cancelled (state-machines.md); `details.retryable` whether a retry can help (TF-020); `details.cause` the job's own code when it was mapped (TF-037)"
        note: { type: string }
        uploadedBy: { $ref: "#/components/schemas/UserRef" }
        uploadedAt: { type: string, format: date-time }
        usedBy:
          type: array
          items: { $ref: "#/components/schemas/RevisionRef" }
    ModelSummary:
      type: object
      description: Mirrors ModelSummary in packages/types/src/api.ts (minus modelId, cached)
      required: [ifcSchema, elementCount, byClass, checks]
      properties:
        ifcSchema: { type: string }
        authoringApp: { type: string }
        disciplineGuess: { type: string }
        storeys:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              elevation: { type: number }
        elementCount: { type: integer }
        openingCount: { type: integer }
        spaceCount: { type: integer }
        byClass: { type: object, additionalProperties: { type: integer } }
        checks: { type: object, description: "CheckCode → count", additionalProperties: { type: integer } }
        checkDetails:
          type: array
          items: { $ref: "../types/schema/parsed-model.schema.json#/definitions/Check" }
        parseMs: { type: integer }
    SceneIndex:
      type: object
      description: Mirrors SceneIndex in packages/types/src/api.ts
      required: [elements, spaces, openings]
      properties:
        elements:
          type: object
          additionalProperties:
            type: object
            required: [ifcClass]
            properties:
              ifcClass: { type: string }
              name: { type: string }
              type: { type: string }
              storey: { type: string }
              parent: { type: string }
              parts: { type: array, items: { type: string } }
        spaces: { type: array, items: { type: string } }
        openings: { type: array, items: { type: string } }
    NamesResponse:
      type: object
      required: [names]
      properties:
        names:
          type: array
          items:
            type: object
            description: Mirrors NameUse in packages/types/src/api.ts
            required: [field, raw, term, method, count, worthAsking]
            properties:
              field: { type: string }
              raw: { type: string }
              term: { type: [string, "null"] }
              method: { type: string }
              layer: { type: string, enum: [project, company, global, decision] }
              dictionary: { type: string }
              entryId: { type: string }
              count: { type: integer }
              classes: { type: array, items: { type: string } }
              worthAsking: { type: boolean }
              extracted: { type: object, additionalProperties: true }

    # ── library ──
    PresetKind: { type: string, enum: [rule_set, classification, dictionary, federation, resolution] }
    PresetLayer: { type: string, enum: [system, org, project] }
    Preset:
      type: object
      required: [id, kind, layer, slug, name, archived]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: [string, "null"], format: uuid }
        projectId: { type: [string, "null"], format: uuid }
        kind: { $ref: "#/components/schemas/PresetKind" }
        layer: { $ref: "#/components/schemas/PresetLayer" }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        basedOn: { type: string }
        starred: { type: boolean, description: "A favourite marker (review A-45)" }
        defaultForNewProjects: { type: boolean, description: "Org presets: new projects start from its latest version (review A-45)" }
        available: { type: boolean, description: "false when a code list must be downloaded first (e.g. Uniclass)" }
        unavailableReason: { type: string }
        latestPublishedVersion: { $ref: "#/components/schemas/PresetVersionInfo" }
        draft: { $ref: "#/components/schemas/PresetVersionInfo" }
        usedByCount: { type: integer }
        archived: { type: boolean }
        permissions: { $ref: "#/components/schemas/Permissions" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/UserRef" }
    PresetCreate:
      type: object
      required: [kind, name, start]
      properties:
        kind: { $ref: "#/components/schemas/PresetKind" }
        name: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        basedOn: { type: string, maxLength: 200 }
        projectId: { type: string, format: uuid, description: Create a project-layer preset }
        start:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [empty, copy, patch] }
            fromVersionId: { type: string, format: uuid }
    PresetVersionInfo:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        number: { type: [integer, "null"] }
        status: { type: string, enum: [draft, published] }
        changeNote: { type: string }
        problemCount: { type: integer }
        publishedBy: { $ref: "#/components/schemas/UserRef" }
        publishedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }
        baseVersionId: { type: [string, "null"], format: uuid, description: "Drafts: the published version the draft started from (review A-43)" }
        baseNumber: { type: [integer, "null"], description: "Drafts: that version's number" }
    PresetInputInfo:
      type: object
      description: A preset version used as a BoQ input or a project default (review A-44)
      required: [versionId, presetId, kind, layer, name, archived]
      properties:
        versionId: { type: string, format: uuid }
        presetId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/PresetKind" }
        layer: { $ref: "#/components/schemas/PresetLayer" }
        name: { type: string }
        number: { type: [integer, "null"] }
        archived: { type: boolean, description: The preset is archived (it keeps working; choose another) }
        newerVersionAvailable: { type: [integer, "null"], description: "The latest published version's number, when it is newer" }
        latestVersionId: { type: [string, "null"], format: uuid, description: "That version, when it is newer" }
    DraftSide:
      type: string
      enum: [mine, theirs]
      description: "In a rebase: the draft's own change, or the latest version's (review A-43)"
    PresetVersion:
      allOf:
        - $ref: "#/components/schemas/PresetVersionInfo"
        - type: object
          required: [presetId, doc, problems]
          properties:
            presetId: { type: string, format: uuid }
            doc: { description: "Engine document: RuleSet | RuleSetPatch | {codeList, map} | Dictionary | FederationSettings | ResolutionSettings" }
            extendsVersionId: { type: [string, "null"], format: uuid }
            problems: { type: array, items: { type: string } }
            flattened: { description: "For rule-set patches, the flattened RuleSet" }
            merged:
              type: array
              items: { type: string }
              description: "Publish of a dictionary draft that was behind (review A-43): what it took from the newer version (`entries:<id>`, `field:<name>`)"
    CheckResponse:
      type: object
      required: [ok, problems]
      properties:
        ok: { type: boolean }
        problems: { type: array, items: { type: string } }
        flattened: { description: Flattened RuleSet for rule sets }
    ItemTextPiece:
      type: object
      description: Plain `text`, or a `blank` as written with its plain field `name` and the engine's `value` when it has them
      properties:
        text: { type: string }
        blank: { type: string }
        name: { type: string }
        value: { type: string }
    ItemTextSample:
      type: object
      required: [pieces, text]
      properties:
        pieces: { type: array, items: { $ref: "#/components/schemas/ItemTextPiece" } }
        text: { type: string, description: The filled text; blanks without a value as written }
    ItemTextSamples:
      type: object
      required: [results]
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/ItemTextSample" } }
    ParamRename:
      type: object
      required: [doc, changes]
      properties:
        doc: { description: The rule set document with the slot renamed }
        changes: { type: integer, description: Places renamed }
    PresetUsage:
      type: object
      required: [projectId, projectName, boqId, boqName, revisionId, revisionLabel, revisionStatus, presetVersionNumber]
      properties:
        projectId: { type: string, format: uuid }
        projectName: { type: string }
        boqId: { type: string, format: uuid }
        boqName: { type: string }
        revisionId: { type: string, format: uuid }
        revisionLabel: { type: string }
        revisionStatus: { $ref: "#/components/schemas/RevisionStatus" }
        presetVersionNumber: { type: integer }
    TermInfo:
      type: object
      required: [id, label, category]
      properties:
        id: { type: string, description: "e.g. concrete.in_situ" }
        label: { type: string }
        category: { type: string }
        parent: { type: string }
        layer: { $ref: "#/components/schemas/PresetLayer" }
    TableReadResponse:
      type: object
      description: Mirrors TableReadResponse in packages/types/src/api.ts
      required: [sheets]
      properties:
        sheets:
          type: array
          items:
            type: object
            required: [name, rows, guess]
            properties:
              name: { type: string }
              rows: { type: array, items: { type: array, items: { type: string } } }
              guess: { type: object, additionalProperties: true }
    CodeListBuildRequest:
      type: object
      description: Mirrors CodeListBuildRequest in packages/types/src/api.ts
      required: [rows, headerRow, hierarchy]
      properties:
        rows: { type: array, maxItems: 100000, items: { type: array, maxItems: 80, items: { type: string, maxLength: 10000 } } }
        headerRow: { type: integer }
        code: { type: integer }
        title: { type: integer }
        parent: { type: integer }
        description: { type: integer }
        level: { type: integer }
        hierarchy: { type: string, enum: [separator, parent, level, flat] }
        separator: { type: [string, "null"], maxLength: 64 }
    CodeListBuildResponse:
      type: object
      required: [codes, problems, stats]
      properties:
        codes: { type: array, items: { $ref: "../types/schema/codelist.schema.json#/definitions/Code" } }
        problems: { type: array, items: { type: string } }
        stats:
          type: object
          properties:
            codes: { type: integer }
            top: { type: integer }
            levels: { type: integer }
            skipped: { type: integer }
            duplicates: { type: integer }

    # ── decisions ──
    Decision:
      type: object
      required: [id, projectId, questionId, kind, answer, decidedAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        questionId: { type: string }
        kind: { type: string }
        answer: { type: [string, number, boolean, "null"] }
        note: { type: string }
        summary: { type: string, description: "Human summary of the question (raw name, element, line)" }
        decidedBy: { $ref: "#/components/schemas/UserRef" }
        decidedAt: { type: string, format: date-time }
        usedByLatestRuns: { type: boolean }
        promotedToPresetVersionId: { type: [string, "null"], format: uuid }
        answerType:
          $ref: "../types/schema/boq-result.schema.json#/definitions/AnswerType"
          description: The answer control of the question it answers, as last asked (S13 edits with it)
    DecisionInput:
      type: object
      required: [questionId, kind, answer]
      properties:
        questionId: { type: string, maxLength: 4000 }
        kind: { type: string, maxLength: 64 }
        answer: { type: [string, number, boolean, "null"], maxLength: 4000 }
        note: { type: string, maxLength: 4000 }

    # ── boqs ──
    RevisionStatus: { type: string, enum: [draft, in_review, approved, issued] }
    RevisionRef:
      type: object
      required: [boqId, boqName, revisionId, label, status]
      properties:
        boqId: { type: string, format: uuid }
        boqName: { type: string }
        revisionId: { type: string, format: uuid }
        label: { type: string }
        status: { $ref: "#/components/schemas/RevisionStatus" }
    RevisionModelInput:
      type: object
      required: [modelId, modelVersionId, discipline]
      properties:
        modelId: { type: string, format: uuid }
        modelVersionId: { type: string, format: uuid }
        discipline: { type: string, maxLength: 200 }
        scope: { $ref: "../types/schema/run-request.schema.json#/definitions/ModelScope" }
        newerVersionAvailable: { type: [integer, "null"], description: Read-only hint }
    RevisionInputs:
      type: object
      required: [models, ruleSetVersionId, classificationVersionIds, dictionaryVersionIds]
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/RevisionModelInput" } }
        ruleSetVersionId: { type: string, format: uuid }
        classificationVersionIds: { type: array, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
        resolutionVersionId: { type: [string, "null"], format: uuid }
    RevisionInputsPartial:
      type: object
      description: Any subset of RevisionInputs; missing fields keep their value (or project defaults on create)
      properties:
        models: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/RevisionModelInput" } }
        ruleSetVersionId: { type: string, format: uuid }
        classificationVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        dictionaryVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
        federationVersionId: { type: [string, "null"], format: uuid }
        resolutionVersionId: { type: [string, "null"], format: uuid }
    ReviewComment:
      type: object
      required: [id, by, at, text]
      properties:
        id: { type: string, format: uuid }
        by: { $ref: "#/components/schemas/UserRef" }
        at: { type: string, format: date-time }
        text: { type: string }
        lineKey: { type: string }
        outcome: { type: string, enum: [approved, changes_requested] }
    BoqRevision:
      type: object
      required: [id, boqId, number, label, status, inputs, pendingChanges, permissions]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        number: { type: integer }
        label: { type: string }
        status: { $ref: "#/components/schemas/RevisionStatus" }
        inputs: { $ref: "#/components/schemas/RevisionInputs" }
        presetInputs:
          type: array
          description: "The preset versions of `inputs` (rule set, classifications, dictionaries, federation, resolution) with their preset, a newer published version (not on saved versions) and whether the preset is archived (review A-44); read-only"
          items: { $ref: "#/components/schemas/PresetInputInfo" }
        currentRun: { $ref: "#/components/schemas/Run" }
        basedOnRevisionId: { type: [string, "null"], format: uuid }
        basedOnRunId: { type: [string, "null"], format: uuid, description: The frozen run of the based-on revision }
        pendingChanges: { type: array, items: { type: string } }
        reviewers: { type: array, items: { $ref: "#/components/schemas/UserRef" } }
        reviewComments: { type: array, items: { $ref: "#/components/schemas/ReviewComment" } }
        submittedBy: { $ref: "#/components/schemas/UserRef" }
        submittedAt: { type: string, format: date-time }
        approvedBy: { $ref: "#/components/schemas/UserRef" }
        approvedAt: { type: string, format: date-time }
        issuedBy: { $ref: "#/components/schemas/UserRef" }
        issuedAt: { type: string, format: date-time }
        issueNote: { type: string }
        openQuestionsAtSave: { type: [integer, "null"] }
        frozen:
          type: object
          properties:
            runId: { type: string, format: uuid }
            exportIds: { type: array, items: { type: string, format: uuid } }
            adjustments:
              type: object
              description: "The line edits and manual lines as they were saved (BR-25): a saved version's sheet shows these, never the working version's (F09 §3, F06 §13)"
              properties:
                overrides: { type: array, items: { $ref: "#/components/schemas/LineOverride" } }
                manualItems: { type: array, items: { $ref: "#/components/schemas/ManualItemRecord" } }
        permissions: { $ref: "#/components/schemas/Permissions" }
    Boq:
      type: object
      required: [id, projectId, name, currentRevision, archived]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [working, confirmed], description: P29 }
        confirmedBy: { $ref: "#/components/schemas/UserRef" }
        confirmedAt: { type: [string, "null"], format: date-time }
        currentRevision: { $ref: "#/components/schemas/BoqRevision" }
        latestIssuedRevisionId: { type: [string, "null"], format: uuid }
        newModelVersionsAvailable: { type: boolean }
        newPresetVersionsAvailable: { type: boolean, description: "A preset input of the working version has a newer published version (review A-44)" }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── adjustments ──
    LineOverrideInput:
      type: object
      description: "A line edit (F06 §6, P20). Omitted fields are not edited. `unit` needs `quantity` (409 unit_needs_quantity); `quantity` and `excluded` need a reason."
      required: [lineKey]
      properties:
        lineKey: { type: string, maxLength: 4000 }
        quantity: { type: [number, "null"], description: null = force flagged }
        description: { type: string, maxLength: 10000 }
        unit: { type: string, maxLength: 64 }
        codes: { type: object, additionalProperties: { type: string, maxLength: 4000 }, description: "classification id → code: moves the line to that section" }
        sortAfter: { type: [string, "null"], maxLength: 4000, description: line key it follows within its section; null = first }
        excluded: { type: boolean }
        reason: { type: string, maxLength: 4000 }
    LineOverride:
      type: object
      required: [id, boqId, lineKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        boqId: { type: string, format: uuid }
        lineKey: { type: string }
        quantity: { type: [number, "null"] }
        description: { type: string }
        unit: { type: string }
        codes: { type: object, additionalProperties: { type: string } }
        sortAfter: { type: [string, "null"] }
        excluded: { type: boolean }
        reason: { type: string }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    ManualItemInput:
      type: object
      required: [item]
      properties:
        item: { $ref: "../types/schema/rule-set.schema.json#/definitions/ManualItem" }
        codes:
          type: object
          description: "classification id → code, for the line's codes"
          additionalProperties: { type: string, maxLength: 4000 }
        sortHint: { type: string, maxLength: 4000 }
    ManualItemRecord:
      allOf:
        - $ref: "#/components/schemas/ManualItemInput"
        - type: object
          required: [id, boqId, createdAt]
          properties:
            id: { type: string, format: uuid }
            boqId: { type: string, format: uuid }
            createdBy: { $ref: "#/components/schemas/UserRef" }
            createdAt: { type: string, format: date-time }

    # ── runs ──
    RunStatus: { type: string, enum: [queued, running, complete, needs_input, failed, cancelled] }
    Run:
      type: object
      required: [id, revisionId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RunStatus" }
        stats:
          type: object
          description: BoqResult.stats plus question and warning counts
          properties:
            elements: { type: integer }
            measuredElements: { type: integer }
            excludedElements: { type: integer }
            unmatchedElements: { type: integer }
            lines: { type: integer }
            flaggedLines: { type: integer }
            decisionsApplied: { type: integer }
            durationMs: { type: integer }
            questions: { type: integer }
            blockingQuestions: { type: integer }
            warnings: { type: integer }
        models: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/ModelReport" } }
        building: { $ref: "../types/schema/boq-result.schema.json#/definitions/BuildingMeasures" }
        snapshotVersions:
          type: object
          description: Which preset versions the run used
          properties:
            ruleSetVersionId: { type: string, format: uuid }
            classificationVersionIds: { type: array, items: { type: string, format: uuid } }
            dictionaryVersionIds: { type: array, items: { type: string, format: uuid } }
            models:
              type: array
              description: The model versions the run used, in input order (F07 §2 loads each into the viewer)
              items:
                type: object
                required: [modelId, modelVersionId, discipline]
                properties:
                  modelId: { type: string, format: uuid }
                  modelVersionId: { type: string, format: uuid }
                  discipline: { type: string }
                  traceId: { type: string, description: "The id the run's results use for this model: ModelReport.id and the lines' trace.elements[].model" }
        classifications:
          type: array
          description: Attached code systems, in order (first = default grouping)
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        engineVersion: { type: string }
        error: { $ref: "#/components/schemas/Error" }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    RunLine:
      type: object
      description: >-
        An engine BoqLine (boq-result.schema.json, BoqLine) plus its place in the run. Its fields are
        listed one by one because the generated BoqLine schema allows no other properties, so an
        allOf with it could never validate (FE-009).
      required: [key, ruleId, ruleKind, description, unit, quantity, source, keys, trace, codes, tags, notes, sortIndex]
      properties:
        key: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/key" }
        ruleId: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/ruleId" }
        ruleKind: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/ruleKind" }
        description: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/description" }
        unit: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/unit" }
        quantity: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/quantity" }
        source: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/source" }
        family: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/family" }
        keys: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/keys" }
        trace: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/trace" }
        codes: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/codes" }
        location: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/location" }
        tags: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/tags" }
        notes: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/notes" }
        toConfirm: { $ref: "../types/schema/boq-result.schema.json#/definitions/BoqLine/properties/toConfirm" }
        sortIndex: { type: integer }
        positionNo: { type: string, description: "Position number in its section, e.g. 5.3 (P30); frozen in saved versions" }
        overridden:
          type: object
          description: >-
            The line's edits as the run applied them (F06 §6, EN-003 extended): which fields were edited,
            with the engine's values, so the sheet can mark them and show what the engine said.
          required: [fields]
          properties:
            fields: { type: array, items: { type: string, enum: [quantity, description, unit, codes, excluded, order] } }
            engineQuantity: { type: [number, "null"] }
            quantity: { type: [number, "null"] }
            engineDescription: { type: string }
            engineUnit: { type: string }
            engineCodes: { type: object, additionalProperties: { type: [string, "null"] }, description: "classification id → the engine's code (null: none)" }
            reason: { type: string }
        excluded: { type: boolean, description: "Excluded by a line edit: out of totals and the exports' BoQ sheet, still listed (BR-03, BR-09)" }
    LineGroup:
      type: object
      required: [path, title, lineCount]
      properties:
        path: { type: string, description: "code path joined by '/'" }
        code: { type: string }
        title: { type: string }
        lineCount: { type: integer, description: "Lines in the group's totals: excluded lines are not counted (BR-63)" }
        unit: { type: [string, "null"], description: "Set when all lines in the totals share one unit (BR-63)" }
        quantity: { type: [number, "null"], description: "Sum of the measured lines when unit is set; null when none is measured (BR-63)" }
    LinesPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RunLine" } }
        groups: { type: array, items: { $ref: "#/components/schemas/LineGroup" } }
        total: { type: integer }
        nextCursor: { type: [string, "null"] }
    LineDetail:
      allOf:
        - $ref: "#/components/schemas/RunLine"
        - type: object
          properties:
            readableFormula: { type: string }
            log: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/LogEntry" } }
            reviewComments: { type: array, items: { $ref: "#/components/schemas/ReviewComment" } }
    QuestionWithDecision:
      type: object
      description: >-
        An engine Question (boq-result.schema.json, Question) joined with the project's decision for it.
        Its fields are listed one by one because the generated Question schema allows no other
        properties, so an allOf with it could never validate (FE-010, like RunLine).
      required: [id, kind, blocking, message, answer, answeredAfterRun]
      properties:
        id: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/id" }
        kind: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/kind" }
        blocking: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/blocking" }
        message: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/message" }
        code: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/code" }
        params: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/params" }
        answer: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/answer" }
        guids: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/guids" }
        field: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/field" }
        raw: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/raw" }
        occurrences: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/occurrences" }
        suggestion: { $ref: "../types/schema/boq-result.schema.json#/definitions/Question/properties/suggestion" }
        decision: { $ref: "#/components/schemas/Decision" }
        answeredAfterRun:
          type: boolean
          description: >-
            The project's answer differs from the one this run was generated with (answered, changed or
            cleared after the run): it applies on the next run (F05 §1, §3).
    LogPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/LogEntry" } }
        nextCursor: { type: [string, "null"] }
    ElementLines:
      type: object
      required: [guid, lines]
      properties:
        guid: { type: string }
        modelVersionId: { type: string, format: uuid }
        ifcClass: { type: string }
        name: { type: string }
        type: { type: string }
        storey: { type: string }
        properties: { type: object, additionalProperties: true }
        status: { type: string, enum: [measured, excluded, unmatched, covered_by_parent] }
        lines:
          type: array
          items:
            type: object
            required: [lineKey, description, unit, quantity]
            properties:
              lineKey: { type: string }
              description: { type: string }
              unit: { type: string }
              quantity: { type: [number, "null"], description: This element's share }
    Coverage:
      type: object
      description: Compact per-element status for viewer colouring
      required: [measured, excluded, unmatched, coveredByParent]
      properties:
        measured: { type: array, items: { type: string } }
        excluded: { type: array, items: { type: string } }
        unmatched: { type: array, items: { type: string } }
        coveredByParent: { type: array, items: { type: string } }

    # ── diffs ──
    DiffSummary:
      type: object
      properties:
        linesAdded: { type: integer }
        linesRemoved: { type: integer }
        linesChanged: { type: integer }
        linesUnchanged: { type: integer }
        elementsAdded: { type: integer }
        elementsRemoved: { type: integer }
        elementsChanged: { type: integer }
        questionsNew: { type: integer }
        questionsResolved: { type: integer }
        guidChurnWarning: { type: boolean, description: "More than half of a model's elements changed GlobalId (F08 edge cases)" }
        inputsChanged: { type: array, items: { type: string }, description: "What differs between the two runs' requests, as BoqRevision.pendingChanges names it" }
        byModel:
          type: array
          description: Elements added, removed and changed per model (F08 §4); only models with changes
          items:
            type: object
            required: [model, added, removed, changed]
            properties:
              model: { type: string, description: The model's name }
              added: { type: integer }
              removed: { type: integer }
              changed: { type: integer }
    LineChange:
      type: object
      required: [lineKey, change]
      properties:
        lineKey: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        before:
          type: object
          properties:
            quantity: { type: [number, "null"] }
            engineQuantity: { type: [number, "null"], description: "Only on a line whose quantity is edited: the engine's value under the edit (BR-09, TF-093)" }
            unit: { type: string }
            description: { type: string }
            codes: { type: object, additionalProperties: true }
        after:
          type: object
          properties:
            quantity: { type: [number, "null"] }
            engineQuantity: { type: [number, "null"], description: "Only on a line whose quantity is edited: the engine's value under the edit (BR-09, TF-093)" }
            unit: { type: string }
            description: { type: string }
            codes: { type: object, additionalProperties: true }
        delta: { type: [number, "null"] }
        deltaPct: { type: [number, "null"] }
        causes:
          type: array
          items: { type: string, enum: [elements_added, elements_removed, elements_changed, rules_changed, decision_changed, override_changed] }
    ElementChange:
      type: object
      required: [guid, change]
      properties:
        guid: { type: string }
        model: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        fields: { type: array, items: { type: string } }
        lineKeys: { type: array, items: { type: string } }
    RunDiff:
      type: object
      required: [id, fromRunId, toRunId, summary]
      properties:
        id: { type: string, format: uuid }
        fromRunId: { type: string, format: uuid }
        toRunId: { type: string, format: uuid }
        summary: { $ref: "#/components/schemas/DiffSummary" }
        questions:
          type: object
          properties:
            new: { type: array, items: { type: string } }
            resolved: { type: array, items: { type: string } }

    # ── exports, jobs, notifications ──
    Export:
      type: object
      required: [id, kind, fileName, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, description: "Core kinds: boq_xlsx, issued_boq_xlsx, changes_xlsx, preset_template_xlsx; modules add their own (e.g. pricing.estimate_xlsx)" }
        subjectType: { type: string }
        subjectId: { type: string }
        fileName: { type: string }
        sizeBytes: { type: integer }
        jobId: { type: string, format: uuid }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
    JobType: { type: string, description: "Core types: parse, run, preview, diff, export_xlsx, import_boq_edits, names; modules add pricing.* and the like" }
    JobStatus: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
    PreviewLine:
      type: object
      required: [key, ruleId, description, quantity, unit]
      properties:
        key: { type: string }
        ruleId: { type: string, description: The BoQ item (rule) the line comes from }
        description: { type: string }
        quantity: { type: [number, "null"] }
        unit: { type: string }
        storey: { type: string }
        keys: { type: object, additionalProperties: true, description: "The values that split the line (`BoqLine.keys`), e.g. for an item text's sample" }
        codes:
          type: object
          description: "classification id → the line's code and its filled item text, as in `BoqLine.codes` (TF-136)"
          additionalProperties:
            type: object
            properties:
              code: { type: string }
              text: { type: string }
    PreviewResult:
      type: object
      description: >-
        What a `preview` job's `output.previewResultUrl` (a signed GET URL, 7 days) returns (F10 §6): the
        lines of the previewed document and, when compared, what changed against the latest published
        version, by line key. The job's output also carries `presetVersionId` (what was previewed),
        `lines` (count) and `compare` (the counts).
      required: [lines, questions, blockingQuestions, warnings, compare, changes]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/PreviewLine" } }
        questions: { type: integer }
        blockingQuestions: { type: integer }
        warnings: { type: integer }
        compare:
          type: [object, "null"]
          required: [versionId, versionNumber, added, removed, changed]
          properties:
            versionId: { type: string, format: uuid }
            versionNumber: { type: integer }
            presetName: { type: string, description: "Set when the comparison is another preset's version: the one a patch with nothing published is based on" }
            added: { type: integer }
            removed: { type: integer }
            changed: { type: integer }
        changes:
          type: array
          items:
            type: object
            required: [key, change]
            properties:
              key: { type: string }
              change: { type: string, enum: [added, removed, changed] }
              before: { $ref: "#/components/schemas/PreviewLine" }
              after: { $ref: "#/components/schemas/PreviewLine" }
    Job:
      type: object
      required: [id, type, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/JobType" }
        status: { $ref: "#/components/schemas/JobStatus" }
        progress:
          type: object
          properties:
            stage: { type: string }
            pct: { type: number }
            message: { type: string }
        subjectType: { type: string }
        subjectId: { type: string }
        output:
          type: object
          description: "Public part of the output: e.g. {exportId}, {diffId}, {previewResultUrl}, {importReport}"
          additionalProperties: true
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
