openapi: 3.1.0
info:
  title: IFC BoQ platform API
  version: 1.0.0-draft
  description: |
    The HTTP contract between the Next.js app and the Java backend.
    Conventions (auth, errors, pagination, idempotency, SSE) are in `docs/architecture/api-conventions.md`.
    Engine shapes are referenced from `packages/types/schema/*.schema.json` (generated from
    `packages/types/src`), never redefined here.

    Request limits (TF-174): free-text fields have a `maxLength` and request arrays a `maxItems`
    (person names 120 characters, other names and labels 200, notes, reasons, comments and
    descriptions 4,000, line descriptions and code-list cells 10,000, line keys and question ids
    4,000); a value over its limit answers `400 invalid_body`. A JSON request body is at most
    1 MiB, or 32 MiB for the operations that carry engine documents or batches (`saveDraft`,
    `checkPreset`, `buildCodeList`, `namesInModel`, `upsertDecisions`, `applyLineEdits`); a larger
    body answers `413 too_large`. Uploads have their own limits.
servers:
  - url: /api/v1
security:
  - session: []
  - session: []
    bearer: []
tags:
  - name: me
  - name: orgs
  - name: billing
  - name: projects
  - name: models
  - name: library
  - name: decisions
  - name: boqs
  - name: adjustments
  - name: runs
  - name: diffs
  - name: exports
  - name: jobs
  - name: notifications
  - name: events
  - name: sessions
  - name: auth
    description: >-
      Native sign-in (P50): email and password on the boqlet domain. Served only by a backend that
      runs native sign-in (Java with `BOQLET_NATIVE_AUTH=true`); with it off, Java
      answers `404 native_auth_disabled`.
  - name: sharing
  - name: public
  - name: admin

paths:
  # ───────────────────────────── me ─────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, memberships, session and module extensions
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
    patch:
      tags: [me]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                locale: { type: string, maxLength: 64 }
                preferences: { $ref: "#/components/schemas/UserPreferences", description: "merged into the stored preferences: a key left out keeps its value (Q55, TF-109)" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
  /me/notification-preferences:
    get:
      tags: [me]
      operationId: getNotificationPreferences
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }
    put:
      tags: [me]
      operationId: setNotificationPreferences
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationPreferences" } } } }

  # ───────────────────────────── orgs ─────────────────────────────
  /orgs:
    get:
      tags: [orgs]
      operationId: listOrgs
      description: "API-only (Q50, TF-080): the app doesn't call it; it reads the user's orgs from `GET /me` memberships."
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Org" } } } } }
    post:
      tags: [orgs]
      operationId: createOrg
      description: >-
        A new org on the default plan, with the caller as its owner. `402 limit_reached` (limit
        `ownedOrgsPerUser`) when the caller already owns as many orgs on the default plan as it
        allows (P57).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getOrg
      description: "API-only (Q50, TF-080): the app doesn't call it; it reads the org from `GET /me` memberships."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Org" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "402": { $ref: "#/components/responses/LimitReached" }
    delete:
      tags: [orgs]
      operationId: deleteOrg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmName]
              properties:
                confirmName: { type: string, maxLength: 200 }
      responses:
        "202": { description: Deletion scheduled }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{orgId}/setup:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getOrgSetup
      description: Setup wizard progress (F16). `204` when the org never started setup.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetup" } } } }
        "204": { description: Setup not started }
    put:
      tags: [orgs]
      operationId: putOrgSetup
      description: Save setup wizard progress (owner, admin, library editor). The presets themselves are saved through the Library endpoints.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetupUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgSetup" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{orgId}/members:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listMembers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Membership" } } } } }
  /orgs/{orgId}/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [orgs]
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [orgs]
      operationId: removeMember
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/invitations:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listOrgInvitations
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/OrgInvitation" } } } } }
    post:
      tags: [orgs]
      operationId: inviteMember
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                role: { $ref: "#/components/schemas/OrgRole" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/OrgInvitation" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/invitations/{invitationId}:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/InvitationId" }]
    delete:
      tags: [orgs]
      operationId: revokeOrgInvitation
      responses:
        "204": { description: Revoked }
  /orgs/{orgId}/invitations/{invitationId}/resend:
    parameters: [{ $ref: "#/components/parameters/OrgId" }, { $ref: "#/components/parameters/InvitationId" }]
    post:
      tags: [orgs]
      operationId: resendOrgInvitation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrgInvitation" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /invitations/{token}:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    get:
      tags: [orgs]
      operationId: previewOrgInvitation
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [orgName, email, role, status]
                properties:
                  orgName: { type: string }
                  email: { type: string }
                  role: { $ref: "#/components/schemas/OrgRole" }
                  status: { type: string, enum: [pending, accepted, revoked, expired] }
        "404": { $ref: "#/components/responses/NotFound" }
  /invitations/{token}/accept:
    parameters: [{ $ref: "#/components/parameters/Token" }]
    post:
      tags: [orgs]
      operationId: acceptOrgInvitation
      responses:
        "200": { description: Joined, content: { application/json: { schema: { $ref: "#/components/schemas/Membership" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orgs/{orgId}/attention:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: getAttention
      summary: The "Needs you" list for the current user in this org
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AttentionItem" } } } } }
  /orgs/{orgId}/audit:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [orgs]
      operationId: listOrgAudit
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
  /orgs/{orgId}/audit.csv:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [exports]
      operationId: exportOrgAuditCsv
      description: The org audit as CSV (S25 "filter, CSV"), with the same filters as listOrgAudit; owner and admin.
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orgs/{orgId}/terms:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [library]
      operationId: listTerms
      summary: Dictionary terms available to this org (system + org layers), for term pickers
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TermInfo" } } } } }

  # ───────────────────────────── billing ─────────────────────────────
  /plans:
    get:
      tags: [billing]
      operationId: listPlans
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } }
  /orgs/{orgId}/entitlements:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getEntitlements
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntitlementsResponse" } } } }
  /orgs/{orgId}/usage:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getUsage
      parameters:
        - { name: month, in: query, description: "YYYY-MM, default current", schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageResponse" } } } }
  /orgs/{orgId}/billing:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getBilling
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Subscription" } } } }
  /orgs/{orgId}/billing/checkout:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    post:
      tags: [billing]
      operationId: createCheckout
      description: >-
        The billing provider's checkout page for a plan (F14). Without self-service billing (the
        pilot's manual billing, D7) the platform admin sets plans (`adminSetSubscription`) and this
        answers `409 checkout_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, returnUrl]
              properties:
                planId: { type: string, maxLength: 64 }
                returnUrl: { type: string, maxLength: 2048 }
      responses:
        "200": { description: Redirect target, content: { application/json: { schema: { $ref: "#/components/schemas/RedirectUrl" } } } }
        "409": { description: No self-service checkout (`checkout_unavailable`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /orgs/{orgId}/billing/portal:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    post:
      tags: [billing]
      operationId: createBillingPortal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnUrl]
              properties:
                returnUrl: { type: string, maxLength: 2048 }
      responses:
        "200": { description: Redirect target, content: { application/json: { schema: { $ref: "#/components/schemas/RedirectUrl" } } } }
  /webhooks/billing/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { type: string } }
    post:
      tags: [billing]
      operationId: billingWebhook
      security: []
      description: Called by the payment provider. Signature verified by the adapter.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        "200": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ───────────────────────────── projects ─────────────────────────────
  /orgs/{orgId}/projects:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [projects]
      operationId: listProjects
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, archived] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectListItem" } } } } }
    post:
      tags: [projects]
      operationId: createProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: getProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProjectUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/archive:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [projects]
      operationId: archiveProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /projects/{projectId}/unarchive:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [projects]
      operationId: unarchiveProject
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /projects/{projectId}/members:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: listProjectMembers
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } }
    post:
      tags: [projects]
      operationId: addProjectMember
      description: Add an org member by userId (project members are org members only, P28).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, role]
              properties:
                userId: { type: string, format: uuid }
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
  /projects/{projectId}/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }, { $ref: "#/components/parameters/UserId" }]
    patch:
      tags: [projects]
      operationId: updateProjectMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/ProjectRole" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectMember" } } } }
    delete:
      tags: [projects]
      operationId: removeProjectMember
      responses:
        "204": { description: Removed }
  /projects/{projectId}/audit:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [projects]
      operationId: listProjectAudit
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditPage" } } } }
  /projects/{projectId}/audit.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [exports]
      operationId: exportProjectAuditCsv
      description: The project audit as CSV, with the same filters as listProjectAudit (F12 "Audit CSV").
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }

  # ───────────────────────────── models ─────────────────────────────
  /projects/{projectId}/models:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [models]
      operationId: listModels
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Model" } } } } }
    post:
      tags: [models]
      operationId: createModel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
        "400": { description: "`invalid_discipline` (one of the federation settings' disciplines, `details.allowed`) or `invalid_scope` (the engine's `details.problems`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /models/{modelId}:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    get:
      tags: [models]
      operationId: getModel
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
    patch:
      tags: [models]
      operationId: updateModel
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ModelUpdate" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Model" } } } }
        "400": { description: "`invalid_discipline` (one of the federation settings' disciplines, `details.allowed`) or `invalid_scope` (the engine's `details.problems`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      tags: [models]
      operationId: archiveModel
      description: "Remove a model (Q50, TF-080): it is archived and leaves the models list; its versions stay for the BoQs and saved versions that use them."
      responses:
        "204": { description: Archived }
  /models/{modelId}/versions:
    parameters: [{ $ref: "#/components/parameters/ModelId" }]
    get:
      tags: [models]
      operationId: listModelVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ModelVersion" } } } } }
    post:
      tags: [models]
      operationId: createModelVersion
      summary: Register a new version and get upload instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, sizeBytes]
              properties:
                fileName: { type: string, maxLength: 255 }
                sizeBytes: { type: integer }
                sha256: { type: string, maxLength: 64 }
                note: { type: string, maxLength: 4000 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [version, upload]
                properties:
                  version: { $ref: "#/components/schemas/ModelVersion" }
                  upload: { $ref: "#/components/schemas/UploadInstructions" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /model-versions/{versionId}:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
    delete:
      tags: [models]
      operationId: deleteModelVersion
      responses:
        "204": { description: Deleted or archived }
        "409": { description: "`version_in_use`: a BoQ uses this version (TF-032)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /model-versions/{versionId}/complete:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: completeModelUpload
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string, maxLength: 256 }
      responses:
        "200": { description: Version queued or ready (deduplicated), content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /model-versions/{versionId}/upload:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: renewModelUpload
      summary: Fresh signed URLs for a version still waiting for its file
      description: "Signed upload URLs last an hour, an upload 24 hours (state-machines.md). A client resuming an interrupted upload after its URLs expired asks for new ones: the same instructions as `createModelVersion`, for the same storage upload, so parts already sent stay sent and their ETags stay valid. Needs `editModels`."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UploadInstructions" } } } }
        "409": { description: "`upload_not_awaited`: the version already has its file, or failed (`upload_expired` after 24 hours)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /model-versions/{versionId}/retry:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: retryModelVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: Re-queued, content: { application/json: { schema: { $ref: "#/components/schemas/ModelVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /model-versions/{versionId}/geometry:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelGeometry
      responses:
        "302": { description: Redirect to a signed URL of geometry.glb }
  /model-versions/{versionId}/scene:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    get:
      tags: [models]
      operationId: getModelScene
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SceneIndex" } } } }
  /model-versions/{versionId}/names:
    parameters: [{ $ref: "#/components/parameters/VersionId" }]
    post:
      tags: [models]
      operationId: namesInModel
      summary: Distinct names in the model and how given dictionaries resolve them (engine rpc)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dictionaryVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
                draftDictionaries:
                  type: array
                  maxItems: 50
                  description: Unsaved dictionary docs (Library editor), most specific last
                  items: { $ref: "../types/schema/dictionary.schema.json#/definitions/Dictionary" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NamesResponse" } } } }

  # ───────────────────────────── library ─────────────────────────────
  /orgs/{orgId}/presets:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [library]
      operationId: listPresets
      description: System presets plus this org's presets (and a project's, with projectId).
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/PresetKind" } }
        - { name: layer, in: query, schema: { $ref: "#/components/schemas/PresetLayer" } }
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Preset" } } } } }
    post:
      tags: [library]
      operationId: createPreset
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PresetCreate" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /presets/{presetId}:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: getPreset
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
    patch:
      tags: [library]
      operationId: updatePreset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                basedOn: { type: string, maxLength: 200 }
                starred: { type: boolean, description: "A favourite marker; it doesn't choose defaults (review A-45)" }
                defaultForNewProjects:
                  type: boolean
                  description: "Review A-45: new projects start from this preset's latest version. Org rule sets, classifications and dictionaries, published; one rule set per org (setting one clears the other). Audited `preset.default_set` / `preset.default_cleared`"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
  /presets/{presetId}/archive:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: archivePreset
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Preset" } } } }
  /presets/{presetId}/versions:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: listPresetVersions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PresetVersionInfo" } } } } }
  /preset-versions/{presetVersionId}:
    parameters: [{ $ref: "#/components/parameters/PresetVersionId" }]
    get:
      tags: [library]
      operationId: getPresetVersion
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
  /presets/{presetId}/draft:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    put:
      tags: [library]
      operationId: saveDraft
      parameters:
        - { name: If-Match, in: header, schema: { type: string }, description: ETag of the draft last read }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc]
              properties:
                doc: { description: The engine document for this preset kind }
      responses:
        "200": { description: Saved and checked, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [library]
      operationId: discardDraft
      responses:
        "204": { description: Discarded }
  /presets/{presetId}/publish:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: publishDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changeNote]
              properties:
                changeNote: { type: string, maxLength: 4000 }
      description: |
        `409 draft_stale` (review A-43) when a version was published after the draft started (its `baseVersionId`)
        and the draft can't take it on its own: always for rule sets and the other kinds, and for a dictionary when
        the draft and that version changed one entry differently (`details.conflicts`, ids `entries:<id>` /
        `field:<name>`). Otherwise a dictionary draft takes that version's changes and the response lists them in `merged`.
        `details`: `baseNumber`, `latestNumber`, `latestVersionId`, `conflicts`. Rebase with `POST /presets/{presetId}/draft/rebase`.
      responses:
        "200": { description: Published version, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /presets/{presetId}/draft/rebase:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: rebaseDraft
      summary: Start the draft again from the latest version (review A-43)
      description: |
        A dictionary merges the draft with the latest version entry by entry; a conflict takes `choices[<id>]`, else
        `keep`. Another kind keeps its own document (`keep: mine`) or takes the latest version's (`keep: theirs`).
        The draft's base becomes the latest version. A draft that is not behind is returned unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keep]
              properties:
                keep: { $ref: "#/components/schemas/DraftSide" }
                choices:
                  type: object
                  maxProperties: 5000
                  additionalProperties: { $ref: "#/components/schemas/DraftSide" }
      responses:
        "200": { description: The rebased draft, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /presets/check:
    post:
      tags: [library]
      operationId: checkPreset
      summary: Engine check of a document without saving (rpc)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, doc]
              properties:
                kind: { $ref: "#/components/schemas/PresetKind" }
                doc: { description: Engine document }
                parentVersionIds: { type: array, maxItems: 50, items: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CheckResponse" } } } }
  /presets/item-texts/sample:
    post:
      tags: [library]
      operationId: sampleItemTexts
      summary: Item texts filled by the engine for the Library's "Reads as" and samples, without a preview run (rpc, review B-13)
      description: >-
        Each template is split into text and blanks the way a run fills it, with the engine's number format.
        A blank gets a value from `filled` (a text the engine filled in a preview, read back against the
        template), else from `line` (a preview line's keys, unit and quantity); with neither, blanks stay as
        written. One call answers a page of codes; 240 calls a minute per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    required: [template]
                    properties:
                      template: { type: string, maxLength: 10000 }
                      line:
                        type: object
                        properties:
                          keys: { type: object, additionalProperties: true }
                          unit: { type: [string, "null"] }
                          quantity: { type: [number, "null"] }
                      filled: { type: string, maxLength: 20000 }
                      filledFrom: { type: string, maxLength: 10000, description: "The template `filled` was filled from, when it differs (a draft being typed)" }
      responses:
        "200": { description: "One result per item, in order", content: { application/json: { schema: { $ref: "#/components/schemas/ItemTextSamples" } } } }
  /presets/rename-param:
    post:
      tags: [library]
      operationId: renamePresetParam
      summary: Rename a rule set's slot everywhere, parsed by the engine (rpc, review B-13)
      description: >-
        Renames the slot's key in `params`, every `{ "param": from }` and every `p.<from>` in the expressions and
        in the templates' blanks. Expressions are parsed as the engine parses them, so string literals and labels
        are never changed. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc, from, to]
              properties:
                doc: { description: The rule set document }
                from: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", maxLength: 100 }
                to: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$", maxLength: 100 }
      responses:
        "200": { description: The renamed document, content: { application/json: { schema: { $ref: "#/components/schemas/ParamRename" } } } }
  /presets/{presetId}/preview:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: previewPreset
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelVersionIds]
              properties:
                draft: { type: boolean, default: true }
                presetVersionId: { type: string, format: uuid }
                modelVersionIds: { type: array, maxItems: 100, items: { type: string, format: uuid } }
                compareWithPublished: { type: boolean, default: true }
                otherInputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }
        "402": { $ref: "#/components/responses/LimitReached" }
  /presets/{presetId}/usage:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    get:
      tags: [library]
      operationId: getPresetUsage
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PresetUsage" } } } } }
  /presets/{presetId}/move-to-latest:
    parameters: [{ $ref: "#/components/parameters/PresetId" }]
    post:
      tags: [library]
      operationId: movePresetToLatest
      summary: Give the working BoQs (and optionally project defaults) that use an older version the latest one (review A-44)
      description: |
        Every working BoQ the caller can see whose working version uses an older published version of this preset gets the
        latest one, as `PATCH /revisions/{id}` would (the version becomes pending; nothing is regenerated). Saved versions
        never move (BR-07). A version in review or approved, a BoQ the caller can't edit (`editBoqs`) and an archived
        project are skipped and listed. With `projectDefaults`, the projects' defaults move too where the caller may edit
        the project (`edit`). `409 no_published_version` when the preset has none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectDefaults: { type: boolean, description: "Also move the projects' defaults (new BoQs)" }
      responses:
        "200":
          description: What moved and what was skipped
          content:
            application/json:
              schema:
                type: object
                required: [latestVersionId, moved, projects, skipped]
                properties:
                  latestVersionId: { type: string, format: uuid }
                  moved:
                    type: array
                    items:
                      type: object
                      required: [boqId, boqName, projectId, projectName, revisionId]
                      properties:
                        boqId: { type: string, format: uuid }
                        boqName: { type: string }
                        projectId: { type: string, format: uuid }
                        projectName: { type: string }
                        revisionId: { type: string, format: uuid }
                  projects:
                    type: array
                    description: Projects whose defaults moved
                    items:
                      type: object
                      required: [projectId, projectName]
                      properties:
                        projectId: { type: string, format: uuid }
                        projectName: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [projectId, projectName, reason]
                      properties:
                        projectId: { type: string, format: uuid }
                        projectName: { type: string }
                        boqId: { type: [string, "null"], format: uuid }
                        boqName: { type: [string, "null"] }
                        reason: { type: string, enum: [no_permission, in_review, project_archived] }
        "409": { $ref: "#/components/responses/Conflict" }
  /codelists/read:
    post:
      tags: [library]
      operationId: readCodeListFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TableReadResponse" } } } }
  /codelists/build:
    post:
      tags: [library]
      operationId: buildCodeList
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CodeListBuildRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CodeListBuildResponse" } } } }

  # ───────────────────────────── decisions ─────────────────────────────
  /projects/{projectId}/decisions:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [decisions]
      operationId: listDecisions
      parameters:
        - { name: kind, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Decision" } } } } }
    post:
      tags: [decisions]
      operationId: upsertDecisions
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/DecisionInput" } }
                addToProjectDictionary: { type: boolean, default: true }
      responses:
        "200":
          description: Saved (or, with dryRun, what would happen)
          content:
            application/json:
              schema:
                type: object
                required: [decisions, reopenedRevisions]
                properties:
                  decisions: { type: array, items: { $ref: "#/components/schemas/Decision" } }
                  reopenedRevisions: { type: array, items: { $ref: "#/components/schemas/RevisionRef" } }
  /decisions/{decisionId}:
    parameters: [{ $ref: "#/components/parameters/DecisionId" }]
    delete:
      tags: [decisions]
      operationId: clearDecision
      responses:
        "204": { description: Cleared }
  /decisions/{decisionId}/promote:
    parameters: [{ $ref: "#/components/parameters/DecisionId" }]
    post:
      tags: [decisions]
      operationId: promoteDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dictionaryPresetId]
              properties:
                dictionaryPresetId: { type: string, format: uuid }
      responses:
        "200": { description: New dictionary version published, content: { application/json: { schema: { $ref: "#/components/schemas/PresetVersion" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /projects/{projectId}/decisions.csv:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [exports]
      operationId: exportDecisionsCsv
      responses:
        "200": { description: CSV, content: { text/csv: { schema: { type: string } } } }

  # ───────────────────────────── boqs ─────────────────────────────
  /projects/{projectId}/boqs:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [boqs]
      operationId: listBoqs
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Boq" } } } } }
    post:
      tags: [boqs]
      operationId: createBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                inputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "201": { description: Created with revision A, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "402": { $ref: "#/components/responses/LimitReached" }
  /boqs/{boqId}:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [boqs]
      operationId: getBoq
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
    patch:
      tags: [boqs]
      operationId: updateBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                archived: { type: boolean, description: false restores an archived BoQ (F04 §6) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
  /boqs/{boqId}/archive:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: archiveBoq
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
  /boqs/{boqId}/revisions:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [boqs]
      operationId: listRevisions
      description: The working version and every saved version. The next working version is created automatically when a version is saved (F09 §2).
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BoqRevision" } } } } }
  /boqs/{boqId}/confirm:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: confirmBoq
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      description: Mark the BoQ as done (F09 §5). Saves a final version first when the working version changed (same fields as saving a version).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 4000 }
                notModelledConfirmed: { type: boolean }
      responses:
        "200": { description: Confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /boqs/{boqId}/reopen:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    post:
      tags: [boqs]
      operationId: reopenBoq
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200": { description: Reopened with a new working version, content: { application/json: { schema: { $ref: "#/components/schemas/Boq" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [boqs]
      operationId: getRevision
      description: "API-only (Q50, TF-080): the app doesn't call it; it reads the current revision with its BoQ (`GET /boqs/{boqId}`)."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
    patch:
      tags: [boqs]
      operationId: updateRevisionInputs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inputs]
              properties:
                inputs: { $ref: "#/components/schemas/RevisionInputsPartial" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { description: "`invalid_inputs`, or `invalid_scope` for a model scope the engine refuses (TF-074)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /revisions/{revisionId}/runs:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [runs]
      operationId: listRuns
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Run" } } } } }
    post:
      tags: [runs]
      operationId: generateRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "202":
          description: Run created and queued
          content:
            application/json:
              schema:
                type: object
                required: [run, job]
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  job: { $ref: "#/components/schemas/Job" }
        "402": { $ref: "#/components/responses/LimitReached" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/reviewer-candidates:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [boqs]
      operationId: listReviewerCandidates
      summary: Who may be chosen as a reviewer of this version (review B-14)
      description: >-
        The people `submitRevision` accepts as reviewers: everyone whose effective project role is lead or approver,
        org owners and admins included (they act as lead, also when they are not project members). `role` is the
        effective role.
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProjectMember" } } } } }
  /revisions/{revisionId}/submit:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: submitRevision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerIds, notModelledConfirmed]
              properties:
                reviewerIds: { type: array, items: { type: string, format: uuid }, minItems: 1, maxItems: 100 }
                message: { type: string, maxLength: 4000 }
                notModelledConfirmed:
                  type: boolean
                  const: true
                  description: The submitter confirms that work not in the models was added (F09 §1, BR-12).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/request-changes:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: requestRevisionChanges
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { type: string, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/approve:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: approveRevision
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 4000 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/issue:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: issueRevision
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      summary: Save version (P29)
      description: Locks the working version as a saved version and opens the next working version. With `approvalRequired` the revision must be `approved`. Open blocking questions are allowed and recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 200 }
                note: { type: string, maxLength: 4000 }
                notModelledConfirmed: { type: boolean, description: "Required (true) when approval is off; with approval on it was given at submit (F09 §2, BR-12)" }
      responses:
        "200": { description: Saved (frozen export job started); the response is the saved version, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/reopen:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: reopenRevision
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BoqRevision" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /revisions/{revisionId}/comments:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    post:
      tags: [boqs]
      operationId: addReviewComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 4000 }
                lineKey: { type: string, maxLength: 4000 }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ReviewComment" } } } }
  /revisions/{revisionId}/exports:
    parameters: [{ $ref: "#/components/parameters/RevisionId" }]
    get:
      tags: [exports]
      operationId: listRevisionExports
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Export" } } } } }

  # ───────────────────────────── adjustments ─────────────────────────────
  /boqs/{boqId}/overrides:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [adjustments]
      operationId: listOverrides
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LineOverride" } } } } }
    post:
      tags: [adjustments]
      operationId: setOverride
      summary: Create or replace the edits of one line (by lineKey); see F06 §6
      description: "API-only (Q50, TF-080): the app doesn't call it; it edits through `applyLineEdits` (`POST /boqs/{boqId}/overrides/batch`)."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LineOverrideInput" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LineOverride" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /overrides/{overrideId}:
    parameters: [{ $ref: "#/components/parameters/OverrideId" }]
    delete:
      tags: [adjustments]
      operationId: removeOverride
      description: "API-only (Q50, TF-080): the app doesn't call it; it restores a line through `applyLineEdits`."
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Conflict" }
  /boqs/{boqId}/manual-items:
    parameters: [{ $ref: "#/components/parameters/BoqId" }]
    get:
      tags: [adjustments]
      operationId: listManualItems
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ManualItemRecord" } } } } }
    post:
      tags: [adjustments]
      operationId: addManualItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemInput" } } }
      responses:
        "201": { description: Added, content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemRecord" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
  /manual-items/{itemId}:
    parameters: [{ $ref: "#/components/parameters/ManualItemId" }]
    patch:
      tags: [adjustments]
      operationId: updateManualItem
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemInput" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ManualItemRecord" } } } }
    delete:
      tags: [adjustments]
      operationId: removeManualItem
      responses:
        "204": { description: Removed }

  # ───────────────────────────── runs ─────────────────────────────
  /runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Run" } } } }
  /runs/{runId}/result:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getRunResult
      description: "API-only (Q50, TF-080): the app doesn't call it; it reads lines, line details and questions through the run's paged endpoints."
      responses:
        "302": { description: Redirect to a signed URL of the full BoqResult JSON (gzip) }
  /runs/{runId}/lines:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listLines
      description: |
        All lines (default, for runs up to 20,000 lines) or grouped server-side when
        `groupBy` and `level` are given (large runs: group rows, then lines per group with `groupPath`).
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { name: limit, in: query, schema: { type: integer, default: 5000, maximum: 20000 } }
        - { name: groupBy, in: query, description: classification id, schema: { type: string } }
        - { name: level, in: query, schema: { type: integer } }
        - { name: groupPath, in: query, description: "code path prefix, e.g. 2/2.5", schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [measured, derived, manual, flagged, overridden] } }
        - { name: storey, in: query, schema: { type: string } }
        - { name: family, in: query, schema: { type: string } }
        - { name: modelId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LinesPage" } } } }
  /runs/{runId}/lines/by-key:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getLine
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LineDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /runs/{runId}/questions:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listQuestions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuestionWithDecision" } } } } }
  /runs/{runId}/warnings:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listWarnings
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "../types/schema/boq-result.schema.json#/definitions/Warning" } } } } }
  /runs/{runId}/log:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: listLog
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: stage, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [info, detail, warning] } }
        - { name: ruleId, in: query, schema: { type: string } }
        - { name: lineKey, in: query, schema: { type: string } }
        - { name: guid, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LogPage" } } } }
  /runs/{runId}/elements/{guid}:
    parameters: [{ $ref: "#/components/parameters/RunId" }, { name: guid, in: path, required: true, schema: { type: string } }]
    get:
      tags: [runs]
      operationId: getElementLines
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ElementLines" } } } }
  /runs/{runId}/coverage:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
    get:
      tags: [runs]
      operationId: getCoverage
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Coverage" } } } }
  /runs/{runId}/compare:
    parameters: [{ $ref: "#/components/parameters/RunId" }]
