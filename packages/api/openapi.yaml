      tags: [exports]
      operationId: exportRun
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [xlsx], default: xlsx }
                groupBy: { type: string, maxLength: 200, description: classification id }
      responses:
        "202": { $ref: "#/components/responses/JobAccepted" }

  # ───────────────────────────── diffs ─────────────────────────────
  /diffs/{diffId}:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
      tags: [diffs]
      operationId: getDiff
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunDiff" } } } }
  /diffs/{diffId}/lines:
    parameters: [{ $ref: "#/components/parameters/DiffId" }]
    get:
